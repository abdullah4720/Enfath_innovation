<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإرشاد | هاكاثون إنفاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#0B1F3A; --navy-light:#122a52; --purple:#5B3E96; --teal:#1F9E8E;
    --gold:#C89B3C; --bg:#F5F6FA; --card:#FFFFFF; --ink:#1A1D29; --muted:#6B7280;
    --border:#E4E6EF; --danger:#C0392B; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #0e2745 100%); color:#fff; padding:22px 24px;}
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#a9b8d4;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px; margin-left:20px; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--teal); border-color:var(--teal);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{border:none; border-radius:9px; padding:11px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:#188878;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:80px auto; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .slot-row{display:flex; justify-content:space-between; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap;}
  .slot-row:last-child{border-bottom:none;}
  .slot-time{font-size:13.5px; font-weight:600;}
  .slot-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-gold{background:#fbf3e2; color:var(--gold);}

  .project-box{background:#f8f9fb; border-radius:10px; padding:12px 14px; margin-top:8px; font-size:12.5px; color:var(--muted);}
</style>
</head>
<body>

<div id="auth-gate-screen" class="auth-gate">
  <h2>لوحة الإرشاد</h2>
  <p>سجّل دخولك بحساب المرشد الخاص بك</p>
  <div id="gate-alert" class="alert"></div>
  <div class="field"><input type="email" id="gate-email" placeholder="البريد الإلكتروني"></div>
  <div class="field"><input type="password" id="gate-password" placeholder="كلمة المرور"></div>
  <button class="btn btn-primary" style="width:100%" onclick="handleGateLogin()">دخول</button>
</div>

<div id="content-screen" style="display:none">
  <header>
    <div class="header-row">
      <div><h1 id="mentor-welcome">لوحة الإرشاد</h1><p>إدارة مواعيدك وملاحظاتك للفرق</p></div>
      <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs-bar">
      <div class="tab active" data-t="slots">مواعيدي</div>
      <div class="tab" data-t="add">إضافة موعد جديد</div>
      <div class="tab" data-t="bulk">إضافة مواعيد بالجملة</div>
      <div class="tab" data-t="profile">ملفي الشخصي</div>
    </div>
    <div id="main-content">جاري التحميل...</div>
  </main>
</div>

<div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,19,38,.5); align-items:center; justify-content:center; z-index:100; padding:20px;">
  <div id="modal-box" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:440px;"></div>
</div>

<script>
const SUPABASE_URL = "https://tuyomqhvdjpsayecystf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2o8HsyqGXPFoQbHn3EfFQ_LqK1qpYA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentTab = "slots";

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("ar-SA", {dateStyle:"medium", timeStyle:"short"});
}
function openModal(html){
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
}
function closeModal(){ document.getElementById("modal-overlay").style.display = "none"; }
document.getElementById("modal-overlay").addEventListener("click", e => { if(e.target.id === "modal-overlay") closeModal(); });

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("mentor") && !roleKeys.includes("admin")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية الإرشاد"; alertBox.className = "alert error";
    return;
  }
  currentUser = data.user;
  showContent();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.session.user.id);
    const roleKeys = (roles||[]).map(r => r.roles?.key);
    if(roleKeys.includes("mentor") || roleKeys.includes("admin")){
      currentUser = data.session.user;
      showContent();
    }
  }
}
restoreSession();

async function showContent(){
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  document.getElementById("tabs-bar").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if(!tab) return;
    currentTab = tab.dataset.t;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === currentTab));
    renderTab();
  });
  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  document.getElementById("mentor-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
  renderTab();
}
function renderTab(){
  if(currentTab === "slots") renderSlots();
  else if(currentTab === "add") renderAddSlot();
  else if(currentTab === "bulk") renderBulkAddSlots();
  else renderMyProfile();
}

/* ---------------- ملفي الشخصي ---------------- */
async function renderMyProfile(){
  const main = document.getElementById("main-content");
  const { data: profile } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  const specOptions = ["الذكاء الاصطناعي وتعلم الآلة","هندسة البرمجيات وتطوير الأنظمة","الأمن السيبراني","القانون والتشريع","التنفيذ القضائي والإجراءات القانونية","تجربة المستخدم وتصميم المنتجات","إدارة المشاريع وريادة الأعمال","البيانات وتحليل الأعمال","أخرى"];
  const domainOptions = ["أكاديمي / جامعي","قطاع حكومي","قطاع قضائي","قطاع خاص / شركات تقنية","ريادة أعمال / تأسيس شركات","أخرى"];
  const [savedSpec, savedDomain] = (profile.specialization||"").split(" — ");
  main.innerHTML = `<div class="card">
    <h3 style="margin:0 0 16px">ملفي الشخصي</h3>
    <div class="field"><label>الاسم الكامل</label><input value="${esc(profile.full_name||"")}" disabled style="opacity:.6"></div>
    <div class="field"><label>التخصص</label>
      <select id="profile-spec">
        <option value="">اختر التخصص</option>
        ${specOptions.map(o => `<option value="${esc(o)}" ${savedSpec===o?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>المجال</label>
      <select id="profile-domain">
        <option value="">اختر المجال</option>
        ${domainOptions.map(o => `<option value="${esc(o)}" ${savedDomain===o?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>نبذة تعريفية</label><textarea id="profile-bio" rows="4" placeholder="خبرتك ذات الصلة بالبرنامج...">${esc(profile.bio||"")}</textarea></div>
    <div id="profile-alert" class="alert"></div>
    <button class="btn btn-primary" onclick="saveMyProfile()">حفظ التعديلات</button>
  </div>`;
}
async function saveMyProfile(){
  const alertBox = document.getElementById("profile-alert");
  alertBox.className = "alert";
  const specValue = document.getElementById("profile-spec").value;
  const domainValue = document.getElementById("profile-domain").value;
  const specialization = specValue + (domainValue ? " — " + domainValue : "");
  const bio = document.getElementById("profile-bio").value.trim();
  const { error } = await sb.from("profiles").update({ specialization, bio }).eq("id", currentUser.id);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }
  alertBox.textContent = "تم الحفظ بنجاح"; alertBox.className = "alert success";
}

/* ---------------- مواعيدي ---------------- */
async function renderSlots(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="card"><div id="slots-list">جاري التحميل...</div></div>`;

  const { data, error } = await sb.from("mentor_slots")
    .select("id, start_time, end_time, is_online, location, is_booked, mentor_bookings(id, team_id, status, requested_topic, teams(team_name, team_code, tracks(name_ar)))")
    .eq("mentor_user_id", currentUser.id)
    .order("start_time");

  const box = document.getElementById("slots-list");
  if(error){ box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="empty-state">لا توجد مواعيد مضافة بعد — أضف موعدك الأول من التبويب الثاني</div>`; return; }

  // جلب آخر مشروع مقدَّم لكل فريق له حجز
  const teamIds = [...new Set(data.map(s => (s.mentor_bookings||[])[0]?.team_id).filter(Boolean))];
  let submissionsByTeam = {};
  if(teamIds.length){
    const { data: submissions } = await sb.from("submissions")
      .select("team_id, title, description, file_url, version")
      .in("team_id", teamIds)
      .order("version", {ascending:false});
    (submissions||[]).forEach(s => {
      if(!submissionsByTeam[s.team_id]) submissionsByTeam[s.team_id] = s; // أعلى إصدار يظهر أول لأننا رتّبنا تنازليًا
    });
  }

  box.innerHTML = data.map(s => {
    const booking = (s.mentor_bookings||[])[0];
    const submission = booking ? submissionsByTeam[booking.team_id] : null;
    return `
    <div class="slot-row">
      <div style="flex:1">
        <div class="slot-time">${fmtDate(s.start_time)}</div>
        <div class="slot-meta">${esc(s.location || (s.is_online ? "عبر الإنترنت" : ""))}</div>
        ${booking ? `
          <div class="project-box">
            <strong style="color:var(--ink)">${esc(booking.teams?.team_name||"")}</strong> <code style="font-size:10.5px;color:var(--gold);background:#fbf3e2;padding:1px 7px;border-radius:6px">${esc(booking.teams?.team_code||"")}</code> · ${esc(booking.teams?.tracks?.name_ar||"")}
            ${booking.requested_topic ? `<br>الموضوع المطلوب: ${esc(booking.requested_topic)}` : ""}
            ${submission ? `
              <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">
                📁 المشروع: <strong>${esc(submission.title)}</strong>
                ${submission.file_url ? `<br><a href="${esc(submission.file_url)}" target="_blank" style="color:var(--teal);font-weight:600">فتح ملف المشروع ↗</a>` : '<br><span style="color:var(--muted)">لا يوجد ملف مرفق</span>'}
              </div>
            ` : `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--muted)">لم يقدّم الفريق مشروعه بعد</div>`}
          </div>
        ` : ""}
      </div>
      <div style="text-align:left">
        ${!booking ? '<span class="badge badge-gray">غير محجوز</span>' :
          booking.status === "completed" ? '<span class="badge badge-green">تم تسجيل الملاحظات</span>' :
          booking.status === "no_show_team" ? '<span class="badge badge-red">لم يحضر الفريق</span>' :
          booking.status === "no_show_mentor" ? '<span class="badge badge-red">لم تحضر (مسجَّل من الفريق)</span>' :
          booking.status === "confirmed" ? '<span class="badge badge-gold">مؤكد</span>' :
          '<span class="badge badge-gray">قيد الانتظار — بانتظار تأكيدك</span>'}
        ${booking && booking.status === "pending" ? `<div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="confirmBooking('${booking.id}')">تأكيد الحجز</button><button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelBookingByMentor('${booking.id}')">إلغاء</button></div>` : ""}
        ${booking && booking.status === "confirmed" && new Date(s.end_time) > new Date() ? `<div style="margin-top:8px"><button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelBookingByMentor('${booking.id}')">إلغاء</button></div>` : ""}
        ${booking && booking.status === "confirmed" && new Date(s.end_time) <= new Date() ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick='openFeedbackModal(${JSON.stringify({bookingId: booking.id, teamId: booking.team_id, teamName: booking.teams?.team_name})})'>تسجيل ملاحظة (إغلاق)</button><button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="markNoShow('${booking.id}','no_show_team')">لم يحضر الفريق</button></div>` : ""}
      </div>
    </div>`;
  }).join("");
}
async function markNoShow(bookingId, statusValue){
  if(!confirm("متأكد؟ هذا الإجراء يسجّل عدم حضور بشكل نهائي بسجل هذا الموعد.")) return;
  const { error } = await sb.from("mentor_bookings").update({ status: statusValue }).eq("id", bookingId);
  if(error){ alert("خطأ: " + error.message); return; }
  renderSlots();
}
async function confirmBooking(bookingId){
  const { error } = await sb.from("mentor_bookings").update({ status: "confirmed" }).eq("id", bookingId);
  if(error){ alert("تعذّر التأكيد: " + error.message); return; }
  renderSlots();
}
async function cancelBookingByMentor(bookingId){
  if(!confirm("متأكد تبي تلغي هذا الحجز؟")) return;
  const { error } = await sb.from("mentor_bookings").update({ status: "cancelled" }).eq("id", bookingId);
  if(error){ alert("تعذّر الإلغاء: " + error.message); return; }
  renderSlots();
}

function openFeedbackModal({bookingId, teamId, teamName}){
  openModal(`
    <h3 style="margin:0 0 4px">ملاحظات جلسة الإرشاد</h3>
    <p style="color:var(--muted);font-size:13px;margin:0 0 18px">فريق: ${esc(teamName)}</p>
    <div class="field"><label>ملاحظاتك</label><textarea id="fb-notes" rows="4" placeholder="أبرز النقاط التي ناقشتها مع الفريق..."></textarea></div>
    <div class="field"><label>تقييم جاهزية الفريق (١ إلى ٥)</label>
      <select id="fb-readiness">
        <option value="1">١ — بداية الطريق</option>
        <option value="2">٢</option>
        <option value="3" selected>٣ — مستوى متوسط</option>
        <option value="4">٤</option>
        <option value="5">٥ — جاهز جدًا</option>
      </select>
    </div>
    <div id="fb-alert" class="alert"></div>
    <div style="display:flex; gap:10px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveFeedback('${bookingId}','${teamId}')">حفظ الملاحظة</button>
    </div>
  `);
}
async function saveFeedback(bookingId, teamId){
  const alertBox = document.getElementById("fb-alert");
  alertBox.className = "alert";
  const notes = document.getElementById("fb-notes").value.trim();
  const readiness = parseInt(document.getElementById("fb-readiness").value);
  if(!notes){ alertBox.textContent = "الرجاء كتابة ملاحظاتك"; alertBox.className = "alert error"; return; }

  const { error: fbError } = await sb.from("mentor_feedback").insert({
    booking_id: bookingId, mentor_user_id: currentUser.id, team_id: teamId,
    notes, team_readiness_score: readiness
  });
  if(fbError){ alertBox.textContent = "خطأ: " + fbError.message; alertBox.className = "alert error"; return; }

  await sb.from("mentor_bookings").update({ status: "completed" }).eq("id", bookingId);
  closeModal();
  renderSlots();
}

/* ---------------- إضافة موعد ---------------- */
async function renderAddSlot(){
  const main = document.getElementById("main-content");
  const { data: tracks } = await sb.from("tracks").select("id,name_ar").eq("is_active", true);
  main.innerHTML = `<div class="card">
    <h3 style="margin:0 0 16px">إضافة موعد إرشاد جديد</h3>
    <div class="field"><label>التاريخ</label><input type="date" id="slot-date"></div>
    <div class="form-row-2">
      <div class="field"><label>وقت البداية</label>
        <select id="slot-time">${generateTimeOptions()}</select>
      </div>
      <div class="field"><label>مدة الجلسة</label>
        <select id="slot-duration">
          <option value="15">15 دقيقة</option>
          <option value="30" selected>30 دقيقة</option>
          <option value="45">45 دقيقة</option>
          <option value="60">60 دقيقة (ساعة)</option>
        </select>
      </div>
    </div>
    <div class="field"><label>المسار (اختياري — اتركه فارغًا ليكون متاح لكل المسارات)</label>
      <select id="slot-track"><option value="">كل المسارات</option>
        ${(tracks||[]).map(t=>`<option value="${t.id}">${esc(t.name_ar)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label><input type="checkbox" id="slot-online" checked> جلسة عبر الإنترنت</label></div>
    <div class="field"><label>الموقع / رابط الاجتماع</label><input id="slot-location" placeholder="اختياري"></div>
    <div id="add-slot-alert" class="alert"></div>
    <button class="btn btn-primary" onclick="saveNewSlot()">إضافة الموعد</button>
  </div>`;
}
function generateTimeOptions(){
  const options = [];
  for(let h = 7; h <= 23; h++){
    for(let m = 0; m < 60; m += 15){
      if(h === 23 && m > 0) break;
      const hh = String(h).padStart(2,"0");
      const mm = String(m).padStart(2,"0");
      const period = h < 12 ? "ص" : "م";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      options.push(`<option value="${hh}:${mm}">${h12}:${mm} ${period}</option>`);
    }
  }
  return options.join("");
}

/* ---------------- إضافة مواعيد بالجملة ---------------- */
async function renderBulkAddSlots(){
  const main = document.getElementById("main-content");
  const { data: tracks } = await sb.from("tracks").select("id,name_ar").eq("is_active", true);
  main.innerHTML = `<div class="card">
    <h3 style="margin:0 0 6px">إضافة مواعيد بالجملة</h3>
    <p class="hint" style="margin:0 0 16px">حدّد يوم ونطاق وقت، والنظام يولّد لك مواعيد متتالية تلقائيًا</p>
    <div class="field"><label>التاريخ</label><input type="date" id="bulk-date"></div>
    <div class="form-row-2">
      <div class="field"><label>من الساعة</label><select id="bulk-start-time">${generateTimeOptions()}</select></div>
      <div class="field"><label>إلى الساعة</label><select id="bulk-end-time">${generateTimeOptions()}</select></div>
    </div>
    <div class="form-row-2">
      <div class="field"><label>مدة كل جلسة</label>
        <select id="bulk-duration">
          <option value="15">15 دقيقة</option>
          <option value="30" selected>30 دقيقة</option>
          <option value="45">45 دقيقة</option>
          <option value="60">60 دقيقة</option>
        </select>
      </div>
      <div class="field"><label>فاصل بين الجلسات</label>
        <select id="bulk-gap">
          <option value="0">بدون فاصل</option>
          <option value="5" selected>5 دقائق</option>
          <option value="10">10 دقائق</option>
          <option value="15">15 دقيقة</option>
        </select>
      </div>
    </div>
    <div class="field"><label>المسار (اختياري)</label>
      <select id="bulk-track"><option value="">كل المسارات</option>
        ${(tracks||[]).map(t=>`<option value="${t.id}">${esc(t.name_ar)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label><input type="checkbox" id="bulk-online" checked> جلسات عبر الإنترنت</label></div>
    <div class="field"><label>الموقع / رابط الاجتماع (يُطبَّق على كل الجلسات)</label><input id="bulk-location" placeholder="اختياري"></div>
    <div id="bulk-preview" class="hint" style="margin-bottom:10px"></div>
    <div id="bulk-alert" class="alert"></div>
    <button class="btn btn-primary" onclick="saveBulkSlots()">إضافة كل المواعيد</button>
  </div>`;

  ["bulk-date","bulk-start-time","bulk-end-time","bulk-duration","bulk-gap"].forEach(id => {
    document.getElementById(id).addEventListener("change", updateBulkPreview);

function computeBulkSlots(){
  const date = document.getElementById("bulk-date").value;
  const startTime = document.getElementById("bulk-start-time").value;
  const endTime = document.getElementById("bulk-end-time").value;
  const duration = parseInt(document.getElementById("bulk-duration").value);
  const gap = parseInt(document.getElementById("bulk-gap").value);
  if(!date) return [];

  const rangeStart = new Date(`${date}T${startTime}:00`);
  const rangeEnd = new Date(`${date}T${endTime}:00`);
  const slots = [];
  let cursor = new Date(rangeStart);
  while(true){
    const slotEnd = new Date(cursor.getTime() + duration * 60000);
    if(slotEnd > rangeEnd) break;
    slots.push({ start: new Date(cursor), end: slotEnd });
    cursor = new Date(slotEnd.getTime() + gap * 60000);
  }
  return slots;
}
function updateBulkPreview(){
  const slots = computeBulkSlots();
  const box = document.getElementById("bulk-preview");
  if(!box) return;
  box.textContent = slots.length ? `سيتم إنشاء ${slots.length} موعد` : "حدّد نطاق وقت صحيح لعرض المعاينة";
}
async function saveBulkSlots(){
  const alertBox = document.getElementById("bulk-alert");
  alertBox.className = "alert";
  const slots = computeBulkSlots();
  if(!slots.length){ alertBox.textContent = "تأكد من التاريخ ونطاق الوقت"; alertBox.className = "alert error"; return; }
  if(slots[0].start < new Date()){ alertBox.textContent = "لا يمكن إضافة مواعيد بتاريخ/وقت ماضٍ"; alertBox.className = "alert error"; return; }

  const track_id = document.getElementById("bulk-track").value || null;
  const is_online = document.getElementById("bulk-online").checked;
  const location = document.getElementById("bulk-location").value.trim();

  const rows = slots.map(s => ({
    mentor_user_id: currentUser.id, start_time: s.start.toISOString(), end_time: s.end.toISOString(),
    track_id, is_online, location: location || null
  }));

  const { error } = await sb.from("mentor_slots").insert(rows);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = `تمت إضافة ${rows.length} موعد بنجاح`; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 1000);
}
async function saveNewSlot(){
  const alertBox = document.getElementById("add-slot-alert");
  alertBox.className = "alert";
  const date = document.getElementById("slot-date").value;
  const time = document.getElementById("slot-time").value;
  const duration = parseInt(document.getElementById("slot-duration").value);
  const track_id = document.getElementById("slot-track").value || null;
  const is_online = document.getElementById("slot-online").checked;
  const location = document.getElementById("slot-location").value.trim();

  if(!date){ alertBox.textContent = "حدّد تاريخ الموعد"; alertBox.className = "alert error"; return; }

  const startDate = new Date(`${date}T${time}:00`);
  const endDate = new Date(startDate.getTime() + duration * 60000);

  if(startDate < new Date()){
    alertBox.textContent = "لا يمكن إضافة موعد بتاريخ ماضٍ"; alertBox.className = "alert error"; return;
  }

  const { error } = await sb.from("mentor_slots").insert({
    mentor_user_id: currentUser.id, start_time: startDate.toISOString(),
    end_time: endDate.toISOString(), track_id, is_online, location: location || null
  });
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = "تمت إضافة الموعد بنجاح"; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 800);
}
