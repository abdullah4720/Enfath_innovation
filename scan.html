<style>
  :root{
    --navy:#1A2E5A; --navy-dark:#0D1B3E; --navy-light:#2A3D6B; --teal:#1F9E8E; --gold:#C9922A;
    --bg:#F7F8FA; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99; --border:#E4E6EF; --danger:#C0392B; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}
  header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #0e2745 100%); color:#fff; padding:20px 24px;}
  .header-row{max-width:520px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;}
  header h1{font-size:17px; margin:0;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:520px; margin:0 auto; padding:20px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:20px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field select{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .btn{border:none; border-radius:9px; padding:12px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; width:100%;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}

  .auth-gate{max-width:380px; margin:16px auto 70px; text-align:center; background:var(--card); border-radius:var(--radius); padding:32px 26px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .auth-gate input{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px; margin-bottom:12px;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  #reader{width:100%; border-radius:12px; overflow:hidden;}
  .result-flash{padding:16px; border-radius:12px; text-align:center; margin-bottom:14px; font-size:14.5px; font-weight:600;}
  .result-flash.ok{background:#e6f7f3; color:var(--teal);}
  .result-flash.warn{background:#fbf3e2; color:var(--gold);}
  .result-flash.err{background:#fdeceb; color:var(--danger);}

  .log-item{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .log-item:last-child{border-bottom:none;}
</style>
</head>

<div id="auth-gate-screen" class="auth-gate">
  <h2>تسجيل الحضور</h2>
  <p>مخصّص لفريق التنسيق فقط</p>
  <div id="gate-alert" class="alert"></div>
  <input type="email" id="gate-email" placeholder="البريد الإلكتروني">
  <input type="password" id="gate-password" placeholder="كلمة المرور">
  <button class="btn btn-primary" onclick="handleGateLogin()">دخول</button>
</div>

<div id="content-screen" style="display:none">
  <header>
    <div class="header-row">
      <h1>تسجيل الحضور</h1>
      <button class="btn-link" onclick="handleLogout()">خروج</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="field">
        <label id="session-label">اختر الجلسة أو الفعالية</label>
        <select id="session-select"></select>
      </div>
      <div class="field" style="margin:0"><label style="display:flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="show-all-sessions" onchange="loadSessionOptions()"> عرض كل الجلسات (وليس المفعّلة فقط)</label></div>
    </div>

    <div id="scan-result"></div>

    <div class="card">
      <div id="reader"></div>
      <button class="btn btn-outline" style="margin-top:12px" onclick="restartScanner()">إعادة تشغيل الكاميرا</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;font-size:14px">آخر عمليات التسجيل بهذه الجلسة</h3>
      <div id="scan-log"><span style="color:var(--muted);font-size:12.5px">لا يوجد تسجيلات بعد</span></div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://tuyomqhvdjpsayecystf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2o8HsyqGXPFoQbHn3EfFQ_LqK1qpYA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let html5QrCode = null;
let scanLog = [];

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("admin") && !roleKeys.includes("coordinator")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب غير مخوّل"; alertBox.className = "alert error";
    return;
  }
  currentUser = data.user;
  showContent();
}
async function handleLogout(){
  if(html5QrCode){ try{ await html5QrCode.stop(); }catch(e){} }
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.session.user.id);
    const roleKeys = (roles||[]).map(r => r.roles?.key);
    if(roleKeys.includes("admin") || roleKeys.includes("coordinator")){
      currentUser = data.session.user;
      showContent();
    }
  }
}
restoreSession();

async function showContent(){
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  await loadSessionOptions();
  startScanner();
}

async function loadSessionOptions(){
  const showAll = document.getElementById("show-all-sessions")?.checked;
  let query = sb.from("prep_sessions").select("id, title, session_date, session_type, is_checkin_active").order("session_date", {ascending:false});
  if(!showAll) query = query.eq("is_checkin_active", true);
  const { data } = await query;

  const select = document.getElementById("session-select");
  if(!showAll && (!data || !data.length)){
    select.innerHTML = `<option value="">لا توجد جلسة مفعّلة حاليًا للتسجيل</option>`;
  } else {
    select.innerHTML = (data||[]).map(s => `<option value="${s.id}">${s.session_type === 'event' ? '📍 ' : '🎓 '}${esc(s.title)} — ${new Date(s.session_date).toLocaleDateString('ar-SA')}</option>`).join("");
  }
  scanLog = [];
  renderScanLog();
}

function startScanner(){
  html5QrCode = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cameras => {
    if(!cameras.length) return;
    const cameraId = cameras[cameras.length - 1].id; // غالبًا الكاميرا الخلفية
    html5QrCode.start(cameraId, { fps: 10, qrbox: 240 }, onScanSuccess, () => {});
  }).catch(() => {
    document.getElementById("scan-result").innerHTML = `<div class="result-flash err">تعذّر الوصول للكاميرا — تأكد من إعطاء الإذن</div>`;
  });
}
function restartScanner(){
  if(html5QrCode){ html5QrCode.stop().then(startScanner).catch(startScanner); }
  else startScanner();
}

let lastScanTime = 0;
async function onScanSuccess(decodedText){
  const now = Date.now();
  if(now - lastScanTime < 2000) return; // منع التكرار السريع لنفس المسح
  lastScanTime = now;

  const resultBox = document.getElementById("scan-result");
  if(!decodedText.startsWith("ENFATH-USER:")){
    resultBox.innerHTML = `<div class="result-flash err">رمز غير صالح</div>`;
    return;
  }
  const userId = decodedText.replace("ENFATH-USER:", "").trim();
  const sessionId = document.getElementById("session-select").value;
  if(!sessionId){
    resultBox.innerHTML = `<div class="result-flash err">اختر الجلسة/الفعالية أولاً</div>`;
    return;
  }

  const { data, error } = await sb.rpc("record_attendance", { p_session_id: sessionId, p_user_id: userId });

  if(error || !data.success){
    resultBox.innerHTML = `<div class="result-flash err">${esc(data?.error || error?.message || "خطأ غير متوقع")}</div>`;
    return;
  }
  if(data.already_checked_in){
    resultBox.innerHTML = `<div class="result-flash warn">⚠ ${esc(data.name)} — مسجّل حضوره مسبقًا</div>`;
  } else {
    resultBox.innerHTML = `<div class="result-flash ok">✅ تم تسجيل حضور ${esc(data.name)}</div>`;
  }
  scanLog.unshift({ name: data.name, time: new Date().toLocaleTimeString('ar-SA'), already: data.already_checked_in });
  renderScanLog();
}
function renderScanLog(){
  const box = document.getElementById("scan-log");
  if(!scanLog.length){ box.innerHTML = `<span style="color:var(--muted);font-size:12.5px">لا يوجد تسجيلات بعد</span>`; return; }
  box.innerHTML = scanLog.slice(0,15).map(l => `<div class="log-item"><span>${esc(l.name)}${l.already?' (مسبق)':''}</span><span style="color:var(--muted)">${l.time}</span></div>`).join("");
}
</script>
