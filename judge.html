<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكيم | هاكاثون ابتكار إنفاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --navy:#001938; --navy-dark:#0D1B3E; --navy-light:#002647; --purple:#5B3E96; --teal:#00BDC4;
    --gold:#C9922A; --bg:#F7F8FA; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  body.dark{
    --bg:#0d1520; --card:#151f30; --ink:#e5e9f0; --muted:#8b96a8; --border:#26324a; --border-light:#1c2536;
  }
  body.dark .stat-card, body.dark .card{ color:var(--ink); }
  /* بطاقة اللجنة */
  .com-card{margin-bottom:16px;border-right:3px solid var(--teal)}
  .cc-head{display:flex;align-items:center;margin-bottom:12px}
  .cc-head i,.cc-head svg{width:22px;height:22px;color:var(--teal);flex-shrink:0;
    margin-left:12px;margin-inline-end:12px}
  .cc-title{font-size:16px;font-weight:700;color:var(--navy)}
  .cc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .cc-desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.7}
  .cc-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
  .cc-member{display:flex;align-items:center;background:var(--bg,#F7F9FB);
    border:1px solid var(--border);border-radius:11px;padding:10px 12px}
  .cc-member.me{background:rgba(0,189,196,.08);border-color:rgba(0,189,196,.3)}
  .cc-ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal);color:#001938;font-weight:800;font-size:14px;
    margin-left:10px;margin-inline-end:10px}
  .cc-info{display:flex;flex-direction:column;min-width:0}
  .cc-name{font-size:13.5px;font-weight:600;color:var(--navy)}
  .cc-spec{font-size:11.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;
    background:rgba(201,146,42,.16);color:#8A6A1E;margin-right:6px;margin-inline-start:6px}
  .cc-tag.me{background:rgba(0,189,196,.18);color:#0A7C82}

  body.dark input, body.dark select, body.dark textarea{
    background:#0f1826 !important; color:var(--ink) !important; border-color:var(--border) !important;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg,#001938 0%,#002647 58%,#00304F 100%); color:#fff; padding:18px 24px;}
  .hdr-brand{display:flex; align-items:center; margin-bottom:14px;}
  .hdr-brand img{height:26px; width:auto; flex-shrink:0; display:block; object-fit:contain;}
  .hdr-brand .sep{width:1px; height:20px; flex-shrink:0; margin:0 18px; background:rgba(255,255,255,.28);}
  .hdr-mark{width:46px; height:46px; border-radius:10px; overflow:hidden; flex-shrink:0; margin-left:14px; margin-inline-end:14px;
            box-shadow:0 0 26px rgba(0,189,196,.3);}
  .hdr-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .hdr-title{display:flex; align-items:center;}
  @media (max-width:640px){
    .hdr-brand img{height:22px} .hdr-brand .sep{margin:0 12px}
    .hdr-mark{width:38px;height:38px;margin-left:10px;margin-inline-end:10px}
  }
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#a9b8d4;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px;}

  .field{margin-bottom:14px;}
  /* تبويبات شاشة الدخول والتقديم */
  .switcher{display:flex;gap:4px;background:var(--bg,#F7F8FA);padding:4px;border-radius:11px;margin-bottom:16px}
  .switcher button{flex:1;padding:9px 12px;border:0;border-radius:8px;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.18s}
  .switcher button.active{background:#fff;color:var(--navy,#001938);box-shadow:0 1px 4px rgba(0,25,56,.1)}
  body.dark .switcher{background:rgba(255,255,255,.06)}
  body.dark .switcher button.active{background:rgba(255,255,255,.14);color:#fff}
  .auth-gate textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
    font-family:inherit;font-size:13.5px;resize:vertical}

  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .btn{border:none; border-radius:9px; padding:12px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-primary:hover{background:#188878;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:20px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .team-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .team-header h3{margin:0 0 3px; font-size:16.5px;}
  .team-header .sub{color:var(--muted); font-size:12.5px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-red{background:#fdeceb; color:var(--danger);}

  .project-box{background:#f8f9fb; border-radius:10px; padding:14px 16px; margin-bottom:16px;}
  .project-box h4{margin:0 0 4px; font-size:13.5px;}
  .project-box p{margin:0; font-size:13px; color:var(--muted); line-height:1.6;}

  /* ---------------- بطاقة المشروع المحسّنة ---------------- */
  .project-card{
    background:linear-gradient(180deg,#fff,#fbfbfd); border:1px solid var(--border-light); border-radius:14px;
    padding:18px 20px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  body.dark .project-card{ background:linear-gradient(180deg,var(--card),var(--card)); }
  .project-card::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--gold);}
  .project-card-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .project-card-icon{width:38px;height:38px;border-radius:10px;background:#fbf3e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .project-card-icon i, .project-card-icon svg{width:18px;height:18px;color:var(--gold);}
  .project-card-title{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 2px;}
  .project-card-meta{font-size:11.5px;color:var(--muted);}
  .project-card-desc{font-size:13.5px;color:var(--ink);line-height:1.75;margin:12px 0;padding-top:12px;border-top:1px solid var(--border-light);}
  .project-card-file{display:inline-flex;align-items:center;gap:6px;background:#e6f7f3;color:var(--teal);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;text-decoration:none;}

  /* ---------------- أزرار الدرجات (1 إلى الأقصى) ---------------- */
  /* nowrap لضمان صف أفقي واحد دائمًا؛ عمود الشبكة أدناه يتّسع لها */
  .score-scale{display:flex; gap:6px; flex-wrap:nowrap; justify-content:flex-start;}
  .score-btn{
    width:42px; height:42px; border-radius:10px; border:1.5px solid var(--border); background:#fff;
    font-family:inherit; font-size:14.5px; font-weight:700; color:var(--muted); cursor:pointer; transition:.15s; flex-shrink:0;
  }
  .score-btn:hover{border-color:var(--gold);}
  .score-btn.selected{background:var(--navy); border-color:var(--navy); color:#fff; transform:scale(1.06);}
  body.dark .score-btn{background:#0f1826;}

  /* ---------------- شريط المجموع الحي ---------------- */
  .live-total-bar{
    display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,var(--navy),var(--navy-light));
    color:#fff; border-radius:12px; padding:14px 18px; margin:16px 0; position:sticky; bottom:10px; z-index:5;
    box-shadow:0 8px 24px rgba(13,27,62,.25);
  }
  .live-total-bar .lbl{font-size:12.5px; color:#c8d3e8;}
  .live-total-bar .val{font-size:22px; font-weight:800; color:var(--gold);}
  .live-total-bar .val small{font-size:13px; color:#c8d3e8; font-weight:500;}

  /* ---------------- نافذة تأكيد الإرسال ---------------- */
  .confirm-overlay{position:fixed; inset:0; background:rgba(13,27,62,.7); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .confirm-box{background:var(--card); border-radius:16px; padding:26px; max-width:440px; width:100%; max-height:85vh; overflow-y:auto;}
  .confirm-box h3{margin:0 0 4px;}
  .confirm-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-light); font-size:13.5px;}
  .confirm-total-row{display:flex; justify-content:space-between; padding:14px 0 4px; font-size:15px; font-weight:800; color:var(--navy);}
  body.dark .confirm-total-row{ color:var(--gold); }

  /* عمود الدرجات: كان ثابتًا على 90px، وهو أضيق من 5 أزرار (234px)
     فكانت الأزرار تلتفّ وتظهر كشبكة بدل صف أفقي. auto يتّسع لها. */
  .criteria-row{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
  .criteria-row:last-of-type{border-bottom:none;}
  .criteria-row .c-name{font-size:13.5px;}
  .criteria-row .c-hint{font-size:11.5px; color:var(--muted);}
  .criteria-row .c-desc{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.6; max-width:340px;}
  .criteria-row input{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; text-align:center; font-family:inherit;}

  /* ---------------- شريط الفلترة ---------------- */
  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-chip{
    padding:9px 16px; border-radius:22px; border:1.5px solid var(--border); background:#fff;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .filter-chip:hover{border-color:var(--gold);}
  .filter-chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  body.dark .filter-chip{background:#0f1826;}

  /* ---------------- بطاقة قابلة للطي ---------------- */
  .team-acc{margin-bottom:12px;}
  .team-acc > summary{
    list-style:none; cursor:pointer; padding:14px 18px; border-radius:12px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .team-acc > summary::-webkit-details-marker{display:none;}
  .team-acc > summary:hover{border-color:var(--gold);}
  .team-acc[open] > summary{border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .acc-chevron{margin-inline-start:auto; transition:.2s; color:var(--muted); flex-shrink:0;}
  .team-acc[open] .acc-chevron{transform:rotate(180deg);}
  .acc-body{border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:18px 20px; background:var(--card);}

  /* ---------------- الجوال ---------------- */
  @media (max-width: 700px){
    /* على الشاشات الضيقة نضع المعيار فوق والأزرار تحته بعرض كامل */
    .criteria-row{grid-template-columns:1fr; gap:10px;}
    .score-scale{justify-content:space-between;}
    .score-btn{width:100%; max-width:52px;}
    .team-acc > summary{padding:12px 14px;}
    .acc-body{padding:14px;}
  }

  /* كان مستخدمًا بتبويب الشهادات لكنه غير معرَّف بهذه الصفحة،
     فكان الصف يظهر بلا تنسيق ويتكدّس عناصره */
  .member-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div id="auth-gate-screen" class="auth-gate">
  <h2>لوحة التحكيم</h2>
  <p id="gate-tagline">شارك خبرتك بتقييم حلول ذكاء اصطناعي واعدة لخدمة القطاع القضائي</p>

  <div class="switcher" id="gate-tabs">
    <button id="tab-login" class="active" onclick="gateTab('login')">تسجيل الدخول</button>
    <button id="tab-apply" onclick="gateTab('apply')">التقديم كمحكّم</button>
  </div>

  <div id="gate-alert" class="alert"></div>

  <!-- دخول -->
  <div id="pane-login">
    <div class="field"><input type="email" id="gate-email" placeholder="البريد الإلكتروني"></div>
    <div class="field"><input type="password" id="gate-password" placeholder="كلمة المرور"></div>
    <button class="btn btn-primary" onclick="handleGateLogin()">دخول</button>
  </div>

  <!-- تقديم -->
  <div id="pane-apply" style="display:none">
    <div class="switcher" style="margin-bottom:14px">
      <button id="ap-new" class="active" onclick="applyMode('new')">حساب جديد</button>
      <button id="ap-existing" onclick="applyMode('existing')">لدي حساب</button>
    </div>

    <div id="ap-new-fields">
      <div class="field"><input id="ap-name" placeholder="الاسم الكامل"></div>
      <div class="field"><input type="email" id="ap-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input id="ap-phone" placeholder="رقم الجوال"></div>
      <div class="field"><input id="ap-org" placeholder="الجهة"></div>
      <div class="field"><input type="password" id="ap-password" placeholder="كلمة المرور"></div>
    </div>

    <div id="ap-existing-fields" style="display:none">
      <div class="field"><input type="email" id="ap-login-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input type="password" id="ap-login-password" placeholder="كلمة المرور"></div>
    </div>

    <div class="field"><input id="ap-position" placeholder="المنصب الحالي (اختياري)"></div>
    <div class="field"><input id="ap-spec" placeholder="التخصص أو المجال"></div>
    <div class="field"><textarea id="ap-bio" rows="3" placeholder="نبذة عن خبرتكم"></textarea></div>

    <button class="btn btn-primary" onclick="submitApplication()">إرسال الطلب</button>
  </div>

  <!-- حالة الطلب -->
  <div id="pane-status" style="display:none;text-align:center;padding:10px 0">
    <p id="status-text" style="font-size:14.5px;line-height:1.9;margin:0 0 14px"></p>
    <button class="btn btn-outline" style="width:auto" onclick="handleLogout()">تسجيل الخروج</button>
  </div>
</div>

async function restoreSession(){

  if(!data.session) return;

  const uid = data.session.user.id;
  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  const keys = (roles || []).map(r => r.roles?.key);

  if(keys.includes("judge") || keys.includes("admin")){
    currentUser = data.session.user;
    showContent();
    return;
  }

  // مسجّل بلا دور: نعرض حالة طلبه
  const { data: app } = await sb.from("judge_applications")
    .select("status").eq("user_id", uid).maybeSingle();

  document.getElementById("gate-tabs").style.display = "none";
  document.getElementById("pane-login").style.display = "none";
  document.getElementById("pane-apply").style.display = "none";
  document.getElementById("pane-status").style.display = "block";

    : app.status === "pending"  ? "طلبكم قيد المراجعة من فريق التنظيم. سنُشعركم فور اعتماده."
    : app.status === "rejected" ? "نعتذر عن عدم إمكانية قبول طلبكم في هذه الدورة."
    : "طلبكم معتمد. إن لم تظهر لوحتكم، يرجى تسجيل الخروج والدخول من جديد.";
}

async function submitApplication(){
  const mode = document.getElementById("ap-new").classList.contains("active") ? "new" : "existing";
  const spec = document.getElementById("ap-spec").value.trim();
  const bio  = document.getElementById("ap-bio").value.trim();
  const pos  = document.getElementById("ap-position").value.trim();

  if(!spec){ gateAlert("التخصص أو المجال مطلوب"); return; }

  let uid = null;

  if(mode === "new"){
    const name  = document.getElementById("ap-name").value.trim();
    const email = document.getElementById("ap-email").value.trim();
    const phone = document.getElementById("ap-phone").value.trim();
    const org   = document.getElementById("ap-org").value.trim();
    const pass  = document.getElementById("ap-password").value;

    if(!name || !email || !pass){ gateAlert("الاسم والبريد وكلمة المرور مطلوبة"); return; }
    if(pass.length < 6){ gateAlert("كلمة المرور يجب ألا تقل عن ستة أحرف"); return; }

    const { data, error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { full_name: name, phone, organization: org } }
    });
    if(error){
      gateAlert(error.message.includes("already")
        ? "هذا البريد مسجّل مسبقًا — استخدموا «لدي حساب»" : error.message);
      return;
    }
    if(!data.session){
      gateAlert("تحققوا من بريدكم لتأكيد الحساب، ثم عودوا واستخدموا «لدي حساب»", "success");
      return;
    }
    uid = data.user.id;
  } else {
    const email = document.getElementById("ap-login-email").value.trim();
    const pass  = document.getElementById("ap-login-password").value;
    if(!email || !pass){ gateAlert("البريد وكلمة المرور مطلوبان"); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ gateAlert("بيانات الدخول غير صحيحة"); return; }
    uid = data.user.id;
  }

  // من اعتُمد سابقًا لا يُعيد التقديم — إعادة الإرسال تُرجع الحالة
  // إلى pending فيفقد صلاحيته.
  const { data: myRoles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  if((myRoles || []).some(r => r.roles?.key === "judge")){
    gateAlert("حسابكم معتمد بالفعل — جارٍ فتح لوحتكم", "success");
    setTimeout(() => location.reload(), 1200);
    return;
  }

  // تعارض المصالح: عضو فريق لا يكون محكّمًا بنفس الحساب
  const { data: mem } = await sb.from("team_members").select("id").eq("user_id", uid).limit(1);
  if(mem && mem.length){
    gateAlert("هذا الحساب مسجَّل عضوًا بأحد الفرق. لمنع تعارض المصالح، استخدموا بريدًا مختلفًا");
    return;
  }

  if(pos) await sb.from("profiles").update({ current_position: pos }).eq("id", uid);

  const { error: appErr } = await sb.from("judge_applications").upsert({
    user_id: uid, specialization: spec, bio: bio || null, status: "pending"
  }, { onConflict: "user_id" });

  if(appErr){ gateAlert("تعذّر إرسال الطلب: " + appErr.message); return; }

  gateAlert("تم إرسال طلبكم. سنُشعركم فور مراجعته", "success");
  setTimeout(() => location.reload(), 1600);
}

/* ---------------- معاينة الشهادة الكاملة + تحميل PDF ---------------- */
/* تصميم موحّد لكل شهادات المنصة (مشارك · مرشد · محكّم)، بهوية
   ابتكار إنفاذ: كحلي #001938 وتركوازي #00BDC4.
   كل الأبعاد بوحدة em ومربوطة بـfont-size البطاقة، فيكفي تغيير
   قيمة واحدة لتكبير التصميم كاملًا بلا كسر النسب. */

// تاريخ ميلادي بأرقام لاتينية — الأرقام الهندية تكسر ترتيب
// النص ثنائي الاتجاه داخل الشهادة
function certDate(d){
  if(!d) return "";
  try{
    return new Date(d).toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", {year:"numeric", month:"long", day:"numeric"});
  }catch(e){
    return new Date(d).toLocaleDateString("ar");
  }
}


// الأرقام داخل جملة عربية قد تختلط ترتيبًا؛ نعزل كل تتابع رقمي
// بـ<bdi>. يُطبَّق بعد esc() فلا خطر حقن — لا نضيف إلا وسم عزل.
function isolateNums(escaped){
  return String(escaped).replace(/(\d+(?:[\-\/:.]\d+)*)/g, '<bdi>$1</bdi>');
}

// النصوص العامة تُقرأ مرة واحدة من لوحة التحكم وتُخزَّن محليًا
let certSharedTexts = null;
async function loadCertSharedTexts(){
  if(certSharedTexts) return certSharedTexts;
  const keys = ["cert_brand_ar","cert_brand_en","cert_signature_label","cert_signature_name","cert_body_scale"];
  try{
    const { data } = await sb.from("platform_settings").select("key,value").in("key", keys);
    const m = {};
    (data||[]).forEach(r => { if(r.value) m[r.key] = r.value; });
    certSharedTexts = m;
  }catch(e){ certSharedTexts = {}; }
  return certSharedTexts;
}


// ---- تنسيق النص ----
// لا نسمح بوسوم HTML مباشرة (ثغرة حقن)، بل برموز آمنة تُحوَّل
// بعد الهروب الأمني. الترتيب مهم: العزل الرقمي أولًا لأن أنماط
// التنسيق تحتوي أرقامًا (مثل 1.25em) قد يلتقطها العازل.
const CERT_RICH_RULES = [
  { re: /\*\*([\s\S]+?)\*\*/g, wrap: '<b style="font-weight:800">$1</b>' },
  { re: /\/\/([\s\S]+?)\/\//g,  wrap: '<i>$1</i>' },
  { re: /__([\s\S]+?)__/g,       wrap: '<u>$1</u>' },
  { re: /\+\+([\s\S]+?)\+\+/g, wrap: '<span style="font-size:1.28em">$1</span>' },
  { re: /~~([\s\S]+?)~~/g,       wrap: '<span style="font-size:.82em">$1</span>' },
  { re: /%%([\s\S]+?)%%/g,       wrap: '<span style="color:#00BDC4">$1</span>' },
];
function certRich(escaped){
  let out = String(escaped);
  CERT_RICH_RULES.forEach(r => { out = out.replace(r.re, r.wrap); });
  return out;
}
// السطر الجاهز للعرض: هروب ثم عزل رقمي ثم تنسيق
function certLine(raw){
  return certRich(isolateNums(esc(raw)));
}

function certMarkup({
name, typeName, text, introText, sigLabelOverride, sigNameOverride, code, date}){

async function openCertOverlay(data){
  await loadCertSharedTexts();
  const overlay = document.createElement("div");
  overlay.id = "cert-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,25,56,.82);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto";
  overlay.innerHTML = `
    <div style="transform-origin:top center">${certMarkup(data)}</div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px">
      <button class="btn btn-primary" id="cert-download-btn" onclick='downloadCertPDF(${JSON.stringify(data.name).replace(/'/g,"&#39;")})'>⬇ تحميل PDF</button>
      <button class="btn btn-outline" style="background:#fff" onclick="document.getElementById('cert-overlay').remove()">إغلاق</button>
    </div>`;
  document.body.appendChild(overlay);
  fitCertToScreen();
  if(window.lucide) lucide.createIcons();
}

// البطاقة بعرض ثابت بالـem؛ نصغّر font-size حتى تتّسع للشاشة
// بدل transform حتى لا يتأثر التقاط html2canvas
function fitCertToScreen(){
  const el = document.getElementById("cert-canvas");
  if(!el) return;
  // نلائم بالعرض *والارتفاع* معًا. الاكتفاء بالعرض يجعل البطاقة
  // تتجاوز الشاشة رأسيًا على اللابتوبات (768px مثلًا) فيضطر
  // المستخدم للتمرير لرؤية زر التحميل.
  const availW = Math.min(window.innerWidth - 60, 1180);
  const availH = window.innerHeight - 150;      // مساحة الأزرار والهوامش
  const fs = Math.max(6, Math.min(11, availW / 87.5, availH / 61.875));
  el.style.fontSize = fs + "px";
}

async function downloadCertPDF(personName){
  const btn = document.getElementById("cert-download-btn");
  const original = btn.textContent;
  btn.textContent = "جاري التحضير...";
  btn.disabled = true;
  const el = document.getElementById("cert-canvas");
  const prevFs = el.style.fontSize;
  try{
    if(typeof html2canvas === "undefined" || !window.jspdf){
      throw new Error("لم تُحمَّل مكتبة التحويل — تحقق من اتصال الإنترنت وأعد المحاولة");
    }
    // نرجع للحجم الكامل قبل الالتقاط لأعلى دقة ممكنة
    el.style.fontSize = "11px";
    const canvas = await html2canvas(el, { scale: 3, backgroundColor: "#ffffff", useCORS: true });
    const imgData = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "landscape", unit: "px", format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
    pdf.save(`شهادة-${personName}.pdf`);
  } catch(err){
    alert("تعذّر توليد ملف PDF: " + err.message);
  } finally {
    el.style.fontSize = prevFs;
    fitCertToScreen();
    btn.textContent = original;
    btn.disabled = false;
  }
}

  if(!round){
    document.getElementById("round-name").textContent = "";
    main.innerHTML = `<div class="card"><div class="empty-state">لا توجد جولة تحكيم نشطة حاليًا. تواصل مع منظّم البرنامج.</div></div>`;
    return;
  }
  activeRound = round;
  document.getElementById("round-name").textContent = round.name_ar;

  const { data: criteria } = await sb.from("judging_criteria").select("*").eq("round_id", round.id).order("display_order");
  criteriaList = criteria || [];

  const { data: assignments, error } = await sb.from("judge_assignments")
    .select("id, has_conflict, conflict_reason, team_id, committee_id, teams(team_name, team_code, tracks(name_ar))")
    .eq("judge_user_id", currentUser.id)
    .eq("round_id", round.id);

  if(error){ main.innerHTML = `<div class="card"><div class="empty-state">خطأ: ${esc(error.message)}</div></div>`; return; }
  if(!assignments.length){ main.innerHTML = `<div class="card"><div class="empty-state">لم يتم تعيين أي فرق لك بهذه الجولة بعد</div></div>`; return; }

  // بطاقة اللجنة تُبنى هنا (داخل async) وتُقرأ عند الرسم
  window._comCard = await buildCommitteeCard(assignments[0]?.committee_id);

  const { data: myScores } = await sb.from("scores").select("*").eq("judge_user_id", currentUser.id).eq("round_id", round.id);

  // الفرق المعتمدة إداريًا — درجاتها مقفلة بالقاعدة (ملف 69).
  // نقرأها هنا لنعرض السبب بوضوح بدل رسالة خطأ عند محاولة الحفظ.
  const { data: approvals } = await sb.from("judging_approvals")
    .select("team_id, status").eq("round_id", round.id);
  const approvedTeams = new Set((approvals||[]).filter(a => a.status === "approved").map(a => a.team_id));

  // استعلامان مجمّعان بدل استعلامين لكل فريق (كان 2×N ويبطئ الصفحة
  // بشكل ملحوظ لما تكثر المشاريع)
  const teamIds = assignments.map(a => a.team_id);
  let subsByTeam = {}, membersByTeam = {};

  if(teamIds.length){
    const [subsRes, memRes] = await Promise.all([
      sb.from("submissions").select("*").in("team_id", teamIds).order("version", {ascending:false}),
      sb.from("team_members").select("team_id, is_leader, profiles(full_name, email, phone)").in("team_id", teamIds)
    ]);
    // أول صف لكل فريق = أعلى إصدار (مرتّبة تنازليًا)
    (subsRes.data||[]).forEach(s => { if(!subsByTeam[s.team_id]) subsByTeam[s.team_id] = s; });
    (memRes.data||[]).forEach(m => { (membersByTeam[m.team_id] = membersByTeam[m.team_id] || []).push(m); });
  }

  // نجهّز بيانات كل فريق مرة واحدة، ثم نعيد الرسم عند تغيير الفلتر بلا استعلام جديد
  judgeCards = assignments.map(a => {
    const teamScores = (myScores||[]).filter(s => s.team_id === a.team_id);
    const alreadyScored = teamScores.length === criteriaList.length && criteriaList.length > 0;
    const isApproved = approvedTeams.has(a.team_id);
    return {
      a,
      teamScores,
      alreadyScored,
      isApproved,
      isLocked: round.results_published || isApproved,
      submission: subsByTeam[a.team_id] || null,
      teamMembers: membersByTeam[a.team_id] || []
    };
  });

  renderJudgeCards();
}

/* ---------------- الفلترة والعرض ---------------- */
let judgeCards = [];
let judgeFilter = "pending";   // pending | done | all

function setJudgeFilter(f){
  judgeFilter = f;
  renderJudgeCards();
}

function renderJudgeCards(){
  const main = document.getElementById("main-content");
  const scorable = judgeCards;
  const pendingCount = scorable.filter(c => !c.alreadyScored).length;
  const doneCount    = scorable.filter(c => c.alreadyScored).length;

  // لو خلص كل شي، ما فيه فايدة من إبقاء فلتر "بانتظار التقييم" فاضي
  if(judgeFilter === "pending" && pendingCount === 0 && doneCount > 0) judgeFilter = "all";

  const visible = judgeCards.filter(c => {

    if(judgeFilter === "pending") return !c.alreadyScored;
    if(judgeFilter === "done")    return c.alreadyScored;
    return true;
  });


  const bar = `<div class="filter-bar">
      <button class="filter-chip ${judgeFilter==='pending'?'active':''}" onclick="setJudgeFilter('pending')">بانتظار التقييم (${pendingCount})</button>
      <button class="filter-chip ${judgeFilter==='done'?'active':''}" onclick="setJudgeFilter('done')">تم التقييم (${doneCount})</button>
      <button class="filter-chip ${judgeFilter==='all'?'active':''}" onclick="setJudgeFilter('all')">الكل (${judgeCards.length})</button>
    </div>`;

  if(!visible.length){
    main.innerHTML = (window._comCard || "") + bar + `<div class="card"><div class="empty-state">${
      judgeFilter === "pending"
        ? "أنهيت تقييم كل الفرق المسندة لك. شكرًا لك."
        : "لا توجد فرق بهذا التصنيف"
    }</div></div>`;
    if(window.lucide) lucide.createIcons();
    return;
  }

  // نفتح البطاقة تلقائيًا لو كانت وحيدة فقط — غير ذلك تبقى مطويّة
  const autoOpen = visible.length === 1;

  main.innerHTML = (window._comCard || "") + bar + visible.map(c => judgeCardHtml(c, autoOpen)).join("");
  if(window.lucide) lucide.createIcons();
  visible.forEach(c => { updateLiveTotal(c.a.team_id); });
}

function judgeCardHtml(c, autoOpen){
  const { a, teamScores, alreadyScored, isApproved, isLocked, submission, teamMembers } = c;
  const teamName  = a.teams?.team_name || "";
  const teamCode  = a.teams?.team_code || "";
  const trackName = a.teams?.tracks?.name_ar || "";

  const header = `<summary class="card" style="margin:0">
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700">${esc(teamName)}
          <code style="font-size:11px;color:var(--gold);background:#fbf3e2;padding:2px 8px;border-radius:6px">${esc(teamCode)}</code>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(trackName)}</div>
      </div>
      ${alreadyScored
          ? '<span class="badge badge-green">تم التقييم</span>'
          : '<span class="badge badge-gray">بانتظار التقييم</span>'}
      <i data-lucide="chevron-down" class="acc-chevron" style="width:17px;height:17px"></i>
    </summary>`;

  // التعارض يُرصد للإدارة فقط — لا يُعرض للمحكّم ولا يمنعه
  return `<details class="team-acc" ${autoOpen ? "open" : ""}>${header}
    <div class="acc-body">
      <details style="margin:0 0 12px">
        <summary style="cursor:pointer;font-size:12px;color:var(--muted)">أعضاء الفريق (${teamMembers.length})</summary>
        <div style="margin-top:8px">
          ${teamMembers.map(m => `
            <div style="font-size:12.5px;padding:4px 0;border-top:1px solid var(--border)">
              ${esc(m.profiles?.full_name||"")} ${m.is_leader ? '<span class="badge badge-gold" style="font-size:9.5px">قائد</span>' : ""}
              <br><span style="color:var(--muted)">${esc(m.profiles?.email||"")} · ${esc(m.profiles?.phone||"")}</span>
            </div>
          `).join("")}
        </div>
      </details>
      ${isLocked ? `<div class="alert" style="display:block;background:#fef3e2;color:#92600a"><i data-lucide="lock" style="width:14px;height:14px;vertical-align:-2px;display:inline-block"></i> ${isApproved ? "اعتمدت الإدارة نتيجة هذا الفريق — التعديل مقفل" : "تم نشر النتائج — التعديل مقفل"}</div>` : ""}
      ${submission ? `
        <div class="project-card">
          <div class="project-card-head">
            <div class="project-card-icon"><i data-lucide="lightbulb"></i></div>
            <div>
              <div class="project-card-title">${esc(submission.title)}</div>
              <div class="project-card-meta">إصدار ${submission.version} · آخر تحديث ${new Date(submission.submitted_at).toLocaleDateString('ar-SA')}</div>
            </div>
          </div>
          <div class="project-card-desc" style="white-space:pre-line">${esc(submission.description||"لا يوجد وصف بعد")}</div>
          ${(() => {
            // حقول الابتكار الثلاثة — تفيد المحكّم في تقدير النضج
            const flags = [
              ["براءة اختراع", submission.has_patent],
              ["سجل تجاري",    submission.has_commercial_registry],
              ["نموذج مصغّر",   submission.has_prototype],
            ].filter(([, v]) => v !== null && v !== undefined);
            if(!flags.length) return "";
            return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
              ${flags.map(([label, v]) => `<span style="font-size:11.5px;padding:4px 12px;border-radius:20px;
                background:${v ? "#e6f7f3" : "var(--border-light)"};color:${v ? "var(--teal)" : "var(--muted)"};font-weight:600">
                ${v ? "✓" : "✗"} ${label}</span>`).join("")}
            </div>`;
          })()}
          ${submission.file_url ? `<a href="${esc(submission.file_url)}" target="_blank" class="project-card-file"><i data-lucide="paperclip" style="width:13px;height:13px"></i> فتح ملف المشروع</a>` : `<p style="font-size:12px;color:var(--muted);margin-top:10px">لم يُرفق الفريق ملفًا</p>`}
        </div>
      ` : `<div class="project-box"><p>لم يقدّم الفريق فكرته بعد</p></div>`}

      ${criteriaList.length ? `
        <div id="criteria-form-${a.team_id}">
          ${criteriaList.map(cr => {
            const existing = teamScores.find(s => s.criteria_id === cr.id);
            return `<div class="criteria-row">
              <div><div class="c-name">${esc(cr.name_ar)}</div><div class="c-hint">الوزن ${cr.weight}% · من ${cr.max_score}</div>${cr.description ? `<div class="c-desc">${esc(cr.description)}</div>` : ""}</div>
              <div class="score-scale" data-team="${a.team_id}" data-criteria="${cr.id}" data-max="${cr.max_score}">
                ${Array.from({length: cr.max_score}, (_, i) => i+1).map(n => `
                  <button type="button" class="score-btn ${Number(existing?.score)===n?'selected':''}" ${isLocked?'disabled':''}
                    onclick="selectScore('${a.team_id}','${cr.id}',${n})">${n}</button>
                `).join("")}
              </div>
              <input type="hidden" id="score-${a.team_id}-${cr.id}" value="${existing?.score ?? ''}">
            </div>`;
          }).join("")}
          <div id="live-total-${a.team_id}"></div>
          <div class="field" style="margin-top:14px"><label>تغذية راجعة للفريق</label>
            <textarea id="comments-${a.team_id}" rows="3" placeholder="اكتب ملاحظاتك — تظهر للفريق بعد إعلان النتائج" ${isLocked ? 'disabled' : ''}>${esc(teamScores[0]?.comments||"")}</textarea>
          </div>
          <div id="submit-alert-${a.team_id}" class="alert"></div>
          ${!isLocked ? `<button class="btn btn-primary" onclick='openConfirmSubmit("${a.team_id}", ${JSON.stringify(teamName)})'>${alreadyScored ? "تحديث التقييم" : "إرسال التقييم"}</button>` : ""}
        </div>
      ` : `<p style="color:var(--muted);font-size:13px">لم يتم تحديد معايير تقييم لهذه الجولة بعد</p>`}
    </div>
  </details>`;
}

function selectScore(teamId, criteriaId, value){
  document.getElementById(`score-${teamId}-${criteriaId}`).value = value;
  const scale = document.querySelector(`.score-scale[data-team="${teamId}"][data-criteria="${criteriaId}"]`);
  scale.querySelectorAll(".score-btn").forEach((btn, i) => btn.classList.toggle("selected", i+1 === value));
  updateLiveTotal(teamId);
}
function updateLiveTotal(teamId){
  const box = document.getElementById(`live-total-${teamId}`);
  if(!box) return;
  let sumWeighted = 0, sumWeight = 0, answeredCount = 0;
  criteriaList.forEach(c => {
    const input = document.getElementById(`score-${teamId}-${c.id}`);
    const val = parseFloat(input?.value);
    if(!isNaN(val)){
      sumWeighted += val * c.weight;
      sumWeight += c.weight;
      answeredCount++;
    }
  });
  const total = sumWeight > 0 ? (sumWeighted / sumWeight) : 0;
  const complete = answeredCount === criteriaList.length;
  box.innerHTML = `<div class="live-total-bar">
    <span class="lbl">${complete ? "المجموع المرجّح الحالي" : `أدخلت ${answeredCount} من ${criteriaList.length} معايير`}</span>
    <span class="val">${complete ? total.toFixed(2) : "—"} <small>/ ${Math.max(...criteriaList.map(c=>c.max_score))}</small></span>
  </div>`;
}

/* ---------------- تأكيد الإرسال قبل الحفظ (لضمان العدالة) ---------------- */
function openConfirmSubmit(teamId, teamName){
  const rows = criteriaList.map(c => {
    const val = document.getElementById(`score-${teamId}-${c.id}`)?.value;
    return { name: c.name_ar, max: c.max_score, weight: c.weight, val: val === "" ? null : parseFloat(val) };
  });
  if(rows.some(r => r.val === null)){
    const alertBox = document.getElementById(`submit-alert-${teamId}`);
    alertBox.textContent = "أكمل تقييم كل المعايير قبل الإرسال";
    alertBox.className = "alert error";
    return;
  }
  const sumWeighted = rows.reduce((s,r) => s + r.val * r.weight, 0);
  const sumWeight = rows.reduce((s,r) => s + r.weight, 0);
  const total = sumWeight > 0 ? sumWeighted / sumWeight : 0;

  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.id = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <h3>تأكيد إرسال التقييم</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">فريق ${esc(teamName)} — راجع درجاتك بعناية، لا يمكن التراجع بسهولة بعد الإرسال</p>
      ${rows.map(r => `<div class="confirm-row"><span>${esc(r.name)}</span><strong>${r.val} / ${r.max}</strong></div>`).join("")}
      <div class="confirm-total-row"><span>المجموع المرجّح</span><span>${total.toFixed(2)}</span></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-outline" style="flex:1;background:none;border:1px solid var(--border)" onclick="document.getElementById('confirm-overlay').remove()">رجوع للتعديل</button>
        <button class="btn btn-primary" style="flex:1" onclick="document.getElementById('confirm-overlay').remove(); submitScores('${teamId}')">تأكيد الإرسال</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

async function submitScores(teamId){
  const alertBox = document.getElementById(`submit-alert-${teamId}`);
  alertBox.className = "alert";
  const comments = document.getElementById(`comments-${teamId}`).value.trim();

  // فرض فترة التحكيم المحددة (إن وُجدت)
  const { data: windowRows } = await sb.from("platform_settings").select("key,value").in("key",["judging_start_date","judging_end_date"]);
  const wMap = {};
  (windowRows||[]).forEach(r => wMap[r.key] = r.value);
  const now = new Date();
  if(wMap.judging_start_date && now < new Date(wMap.judging_start_date)){
    alertBox.textContent = `التحكيم لم يبدأ بعد — يبدأ ${new Date(wMap.judging_start_date).toLocaleString('ar-SA')}`;
    alertBox.className = "alert error";
    return;
  }
  if(wMap.judging_end_date && now > new Date(wMap.judging_end_date)){
    alertBox.textContent = `انتهت فترة التحكيم المحددة`;
    alertBox.className = "alert error";
    return;
  }

  // فحص أيام التحكيم — الفرض الفعلي بالقاعدة (ملف 70)، وهذا
  // لعرض سبب واضح بدل رسالة خطأ عامة
  const { data: jDays } = await sb.from("program_days")
    .select("day_number, starts_at, ends_at").eq("phase","judging").order("day_number");
  if(jDays && jDays.length){
    const now2 = new Date();
    const inside = jDays.some(d => now2 >= new Date(d.starts_at) && now2 <= new Date(d.ends_at));
    if(!inside){
      const next = jDays.find(d => new Date(d.starts_at) > now2);
      alertBox.textContent = next
        ? `التحكيم مغلق حاليًا — يفتح اليوم ${next.day_number} بتاريخ ${new Date(next.starts_at).toLocaleString('ar-SA')}`
        : "انتهت أيام التحكيم المحددة";
      alertBox.className = "alert error";
      return;
    }
  }

  const rows = [];
  for(const c of criteriaList){
    const input = document.getElementById(`score-${teamId}-${c.id}`);
    const val = parseFloat(input.value);
    if(isNaN(val) || val < 0 || val > c.max_score){
      alertBox.textContent = `تأكد من إدخال درجة صحيحة لكل معيار (0 إلى ${c.max_score})`;
      alertBox.className = "alert error";
      input.focus();
      return;
    }
    rows.push({ criteria_id: c.id, score: val, comments: comments || null });
  }

  const { data, error } = await sb.rpc("upsert_scores_guarded", {
    p_round_id: activeRound.id, p_team_id: teamId, p_rows: rows
  });
  if(error || !data.success){ alertBox.textContent = "خطأ: " + (data?.error || error?.message); alertBox.className = "alert error"; return; }

  alertBox.textContent = "تم حفظ التقييم بنجاح"; alertBox.className = "alert success";
  setTimeout(() => loadAssignments(), 900);
}
