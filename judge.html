<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكيم | هاكاثون إنفاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --navy:#1A2E5A; --navy-dark:#0D1B3E; --navy-light:#2A3D6B; --purple:#5B3E96; --teal:#1F9E8E;
    --gold:#C9922A; --bg:#F7F8FA; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #0e2745 100%); color:#fff; padding:22px 24px;}
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#a9b8d4;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .btn{border:none; border-radius:9px; padding:12px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-primary:hover{background:#188878;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:20px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .team-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .team-header h3{margin:0 0 3px; font-size:16.5px;}
  .team-header .sub{color:var(--muted); font-size:12.5px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-red{background:#fdeceb; color:var(--danger);}

  .project-box{background:#f8f9fb; border-radius:10px; padding:14px 16px; margin-bottom:16px;}
  .project-box h4{margin:0 0 4px; font-size:13.5px;}
  .project-box p{margin:0; font-size:13px; color:var(--muted); line-height:1.6;}

  .criteria-row{display:grid; grid-template-columns:1fr 90px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .criteria-row:last-of-type{border-bottom:none;}
  .criteria-row .c-name{font-size:13.5px;}
  .criteria-row .c-hint{font-size:11.5px; color:var(--muted);}
  .criteria-row input{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; text-align:center; font-family:inherit;}

  .conflict-notice{background:#fdeceb; color:var(--danger); border-radius:9px; padding:12px 16px; font-size:13px; text-align:center;}
</style>
</head>
<body>

<div style="text-align:center; padding-top:40px;">
  <img src="data:image/png;base64,QASSIM_LOGO_B64" alt="جامعة القصيم" style="height:28px; display:inline-block; vertical-align:middle;">
  <span style="display:inline-block; width:1px; height:22px; background:var(--border); margin:0 12px; vertical-align:middle;"></span>
  <img src="data:image/png;base64,INFATH_LOGO_B64" alt="إنفاذ" style="height:28px; display:inline-block; vertical-align:middle;">
</div>
<div id="auth-gate-screen" class="auth-gate">
  <h2>لوحة التحكيم</h2>
  <p>سجّل دخولك بحساب المحكّم الخاص بك</p>
  <div id="gate-alert" class="alert"></div>
  <div class="field"><input type="email" id="gate-email" placeholder="البريد الإلكتروني"></div>
  <div class="field"><input type="password" id="gate-password" placeholder="كلمة المرور"></div>
  <button class="btn btn-primary" onclick="handleGateLogin()">دخول</button>
</div>

<div id="content-screen" style="display:none">
  <header>
    <div class="header-row">
      <div>
        <h1 id="judge-welcome">لوحة التحكيم</h1>
        <p id="round-name"></p>
      </div>
      <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </header>
  <main>
    <div class="tabs" style="display:flex;gap:8px;margin-bottom:16px">
      <div class="tab active" id="judge-tab-teams" onclick="switchJudgeTab('teams')" style="cursor:pointer;padding:9px 18px;border-radius:20px;background:var(--navy);color:#fff;font-size:13px"><i data-lucide="scale" style="width:14px;height:14px;vertical-align:-2px"></i> الفرق والتقييم</div>
      <div class="tab" id="judge-tab-certs" onclick="switchJudgeTab('certs')" style="cursor:pointer;padding:9px 18px;border-radius:20px;background:#f0f1f5;color:var(--ink);font-size:13px"><i data-lucide="award" style="width:14px;height:14px;vertical-align:-2px"></i> شهاداتي</div>
    </div>
    <div id="main-content">جاري التحميل...</div>
  </main>
</div>

<div id="modal-overlay" style="display:flex; position:fixed; inset:0; background:rgba(11,19,38,.5); align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s;">
  <div id="modal-box" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:440px;"></div>
</div>
<style>
  #modal-overlay.active{ opacity:1; pointer-events:auto; }
</style>

<script>
const SUPABASE_URL = "https://tuyomqhvdjpsayecystf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2o8HsyqGXPFoQbHn3EfFQ_LqK1qpYA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("modal-overlay").addEventListener("click", (e)=>{
  if(e.target.id === "modal-overlay") e.target.classList.remove("active");
});
let currentUser = null;
let activeRound = null;
let criteriaList = [];

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("judge") && !roleKeys.includes("admin")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية التحكيم"; alertBox.className = "alert error";
    return;
  }
  currentUser = data.user;
  showContent();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.session.user.id);
    const roleKeys = (roles||[]).map(r => r.roles?.key);
    if(roleKeys.includes("judge") || roleKeys.includes("admin")){
      currentUser = data.session.user;
      showContent();
    }
  }
}
restoreSession();

async function showContent(){
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  if(window.lucide){
    lucide.createIcons();
    const observer = new MutationObserver(() => {
      clearTimeout(window._lucideDebounce);
      window._lucideDebounce = setTimeout(() => lucide.createIcons(), 60);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  document.getElementById("judge-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
  await loadAssignments();
}

function switchJudgeTab(tab){
  document.getElementById("judge-tab-teams").style.background = tab==="teams" ? "var(--navy)" : "#f0f1f5";
  document.getElementById("judge-tab-teams").style.color = tab==="teams" ? "#fff" : "var(--ink)";
  document.getElementById("judge-tab-certs").style.background = tab==="certs" ? "var(--navy)" : "#f0f1f5";
  document.getElementById("judge-tab-certs").style.color = tab==="certs" ? "#fff" : "var(--ink)";
  if(tab === "teams") loadAssignments();
  else renderJudgeCertsTab();
}
async function renderJudgeCertsTab(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="card">جاري التحميل...</div>`;

  const { data: types, error } = await sb.from("certificate_types").select("*").eq("is_active", true).or("role_key.eq.judge,role_key.is.null");
  if(error){ main.innerHTML = `<div class="card"><p class="hint">خطأ: ${esc(error.message)}</p></div>`; return; }
  if(!types || !types.length){ main.innerHTML = `<div class="card"><h3>شهاداتي</h3><p class="hint">لا توجد شهادات متاحة لفئة المحكّمين بعد</p></div>`; return; }

  const { data: myCerts } = await sb.from("certificates").select("cert_type_id, verification_code, issued_at").eq("user_id", currentUser.id);
  const issuedMap = {};
  (myCerts||[]).forEach(c => issuedMap[c.cert_type_id] = c);

  main.innerHTML = `<div class="card"><h3 style="margin:0 0 14px">شهاداتي</h3>
    ${types.map(t => {
      const issued = issuedMap[t.id];
      return `<div class="member-row">
        <span>${esc(t.name_ar)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          ${issued
            ? `<span class="badge badge-green">صادرة</span><button class="btn-link" style="font-size:12px" onclick='previewJudgeCert(${JSON.stringify({typeName: t.name_ar, text: t.certificate_text, code: issued.verification_code, date: issued.issued_at})})'>معاينة</button>`
            : `<button class="btn btn-outline btn-sm" style="width:auto" onclick="issueJudgeCertificate('${t.key}')">إصدار الشهادة</button>`}
        </span>
      </div>`;
    }).join("")}
  </div>`;
}
async function issueJudgeCertificate(certKey){
  const { data, error } = await sb.rpc("issue_certificate", { p_cert_type_key: certKey });
  if(error){ alert("خطأ: " + error.message); return; }
  if(!data.success){ alert("لم تكتمل الشروط بعد لإصدار هذه الشهادة"); return; }
  renderJudgeCertsTab();
}
async function previewJudgeCert({typeName, text, code, date}){
  const { data: p } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).single();
  const name = p?.full_name || "";
  const bodyText = (text || "نشهد بأن {{name}} قد أتمّ متطلبات {{type}} بنجاح ضمن فعاليات هاكاثون إنفاذ.")
    .replace(/\{\{name\}\}/g, name).replace(/\{\{type\}\}/g, typeName)
    .replace(/\{\{date\}\}/g, date ? new Date(date).toLocaleDateString('ar-SA') : "")
    .replace(/\{\{code\}\}/g, code || "");
  const overlay = document.getElementById("modal-overlay");
  const box = document.getElementById("modal-box");
  box.innerHTML = `
    <div style="border:3px double var(--gold); border-radius:12px; padding:30px 24px; text-align:center; background:linear-gradient(180deg,#fdfdfb,#f7f5ef)">
      <div style="font-size:11px; letter-spacing:.1em; color:var(--gold); font-weight:700; margin-bottom:10px">شهادة ${esc(typeName)}</div>
      <h2 style="margin:0 0 4px">${esc(name)}</h2>
      <div style="width:60px; height:2px; background:var(--gold); margin:14px auto"></div>
      <p style="font-size:14px; line-height:1.9; margin:16px 0">${esc(bodyText)}</p>
      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:24px; border-top:1px solid var(--border); padding-top:12px">
        <span>رمز التحقق: ${esc(code||"—")}</span><span>${date ? new Date(date).toLocaleDateString('ar-SA') : ""}</span>
      </div>
    </div>
    <div class="modal-actions" style="margin-top:16px"><button class="btn btn-outline" onclick="document.getElementById('modal-overlay').classList.remove('active')">إغلاق</button></div>
  `;
  overlay.classList.add("active");
}
async function loadAssignments(){
  const main = document.getElementById("main-content");

  const { data: round } = await sb.from("judging_rounds").select("*").eq("is_active", true).limit(1).maybeSingle();
  if(!round){
    document.getElementById("round-name").textContent = "";
    main.innerHTML = `<div class="card"><div class="empty-state">لا توجد جولة تحكيم نشطة حاليًا. تواصل مع منظّم البرنامج.</div></div>`;
    return;
  }
  activeRound = round;
  document.getElementById("round-name").textContent = round.name_ar;

  const { data: criteria } = await sb.from("judging_criteria").select("*").eq("round_id", round.id).order("display_order");
  criteriaList = criteria || [];

  const { data: assignments, error } = await sb.from("judge_assignments")
    .select("id, has_conflict, conflict_reason, team_id, teams(team_name, team_code, tracks(name_ar))")
    .eq("judge_user_id", currentUser.id)
    .eq("round_id", round.id);

  if(error){ main.innerHTML = `<div class="card"><div class="empty-state">خطأ: ${esc(error.message)}</div></div>`; return; }
  if(!assignments.length){ main.innerHTML = `<div class="card"><div class="empty-state">لم يتم تعيين أي فرق لك بهذه الجولة بعد</div></div>`; return; }

  const { data: myScores } = await sb.from("scores").select("*").eq("judge_user_id", currentUser.id).eq("round_id", round.id);

  let html = "";
  for(const a of assignments){
    if(a.has_conflict){
      html += `<div class="card">
        <div class="team-header"><div><h3>${esc(a.teams?.team_name||"")} <code style="font-size:11px;color:var(--gold);background:#fbf3e2;padding:2px 8px;border-radius:6px">${esc(a.teams?.team_code||"")}</code></h3><span class="sub">${esc(a.teams?.tracks?.name_ar||"")}</span></div></div>
        <div class="conflict-notice">⚠ تم استبعادك من تقييم هذا الفريق بسبب تعارض مصالح محتمل (${esc(a.conflict_reason||"")})</div>
      </div>`;
      continue;
    }

    const { data: submission } = await sb.from("submissions").select("*").eq("team_id", a.team_id).order("version",{ascending:false}).limit(1).maybeSingle();
    const { data: teamMembers } = await sb.from("team_members").select("is_leader, profiles(full_name, email, phone)").eq("team_id", a.team_id);
    const teamScores = (myScores||[]).filter(s => s.team_id === a.team_id);
    const alreadyScored = teamScores.length === criteriaList.length && criteriaList.length > 0;
    const isLocked = round.results_published;

    html += `<div class="card">
      <div class="team-header">
        <div><h3>${esc(a.teams?.team_name||"")} <code style="font-size:11px;color:var(--gold);background:#fbf3e2;padding:2px 8px;border-radius:6px">${esc(a.teams?.team_code||"")}</code></h3><span class="sub">${esc(a.teams?.tracks?.name_ar||"")}</span></div>
        ${alreadyScored ? '<span class="badge badge-green">تم التقييم</span>' : '<span class="badge badge-gray">بانتظار التقييم</span>'}
      </div>
      <details style="margin:8px 0">
        <summary style="cursor:pointer;font-size:12px;color:var(--muted)">أعضاء الفريق (${teamMembers?.length||0})</summary>
        <div style="margin-top:8px">
          ${(teamMembers||[]).map(m => `
            <div style="font-size:12.5px;padding:4px 0;border-top:1px solid var(--border)">
              ${esc(m.profiles?.full_name||"")} ${m.is_leader ? '<span class="badge badge-gold" style="font-size:9.5px">قائد</span>' : ""}
              <br><span style="color:var(--muted)">${esc(m.profiles?.email||"")} · ${esc(m.profiles?.phone||"")}</span>
            </div>
          `).join("")}
        </div>
      </details>
      ${isLocked ? `<div class="alert" style="display:block;background:#fef3e2;color:#92600a"><i data-lucide="lock" style="width:14px;height:14px;vertical-align:-2px;display:inline-block"></i> تم نشر النتائج — التعديل مقفل</div>` : ""}
      ${submission ? `
        <div class="project-box">
          <h4>${esc(submission.title)}</h4>
          <p>${esc(submission.description||"")}</p>
          ${submission.file_url ? `<a href="${esc(submission.file_url)}" target="_blank" style="color:var(--teal);font-size:12.5px;font-weight:600"><i data-lucide="paperclip" style="width:14px;height:14px;vertical-align:-2px;display:inline-block"></i> فتح الملف المرفق</a>` : ""}
        </div>
      ` : `<div class="project-box"><p>لم يقدّم الفريق فكرته بعد</p></div>`}

      ${criteriaList.length ? `
        <div id="criteria-form-${a.team_id}">
          ${criteriaList.map(c => {
            const existing = teamScores.find(s => s.criteria_id === c.id);
            return `<div class="criteria-row">
              <div><div class="c-name">${esc(c.name_ar)}</div><div class="c-hint">الوزن ${c.weight}% · من ${c.max_score}</div></div>
              <input type="number" min="0" max="${c.max_score}" id="score-${a.team_id}-${c.id}" value="${existing?.score ?? ''}" ${isLocked ? 'disabled' : ''}>
            </div>`;
          }).join("")}
          <div class="field" style="margin-top:14px"><label>تغذية راجعة للفريق</label>
            <textarea id="comments-${a.team_id}" rows="3" placeholder="اكتب ملاحظاتك — راح تظهر للفريق بعد إعلان النتائج" ${isLocked ? 'disabled' : ''}>${esc(teamScores[0]?.comments||"")}</textarea>
          </div>
          <div id="submit-alert-${a.team_id}" class="alert"></div>
          ${!isLocked ? `<button class="btn btn-primary" onclick="submitScores('${a.team_id}')">${alreadyScored ? "تحديث التقييم" : "إرسال التقييم"}</button>` : ""}
        </div>
      ` : `<p style="color:var(--muted);font-size:13px">لم يتم تحديد معايير تقييم لهذه الجولة بعد</p>`}
    </div>`;
  }
  main.innerHTML = html;
}

async function submitScores(teamId){
  const alertBox = document.getElementById(`submit-alert-${teamId}`);
  alertBox.className = "alert";
  const comments = document.getElementById(`comments-${teamId}`).value.trim();

  // فرض فترة التحكيم المحددة (إن وُجدت)
  const { data: windowRows } = await sb.from("platform_settings").select("key,value").in("key",["judging_start_date","judging_end_date"]);
  const wMap = {};
  (windowRows||[]).forEach(r => wMap[r.key] = r.value);
  const now = new Date();
  if(wMap.judging_start_date && now < new Date(wMap.judging_start_date)){
    alertBox.textContent = `التحكيم لم يبدأ بعد — يبدأ ${new Date(wMap.judging_start_date).toLocaleString('ar-SA')}`;
    alertBox.className = "alert error";
    return;
  }
  if(wMap.judging_end_date && now > new Date(wMap.judging_end_date)){
    alertBox.textContent = `انتهت فترة التحكيم المحددة`;
    alertBox.className = "alert error";
    return;
  }

  const rows = [];
  for(const c of criteriaList){
    const input = document.getElementById(`score-${teamId}-${c.id}`);
    const val = parseFloat(input.value);
    if(isNaN(val) || val < 0 || val > c.max_score){
      alertBox.textContent = `تأكد من إدخال درجة صحيحة لكل معيار (0 إلى ${c.max_score})`;
      alertBox.className = "alert error";
      input.focus();
      return;
    }
    rows.push({ criteria_id: c.id, score: val, comments: comments || null });
  }

  const { data, error } = await sb.rpc("upsert_scores_guarded", {
    p_round_id: activeRound.id, p_team_id: teamId, p_rows: rows
  });
  if(error || !data.success){ alertBox.textContent = "خطأ: " + (data?.error || error?.message); alertBox.className = "alert error"; return; }

  alertBox.textContent = "تم حفظ التقييم بنجاح"; alertBox.className = "alert success";
  setTimeout(() => loadAssignments(), 900);
}
</script>
