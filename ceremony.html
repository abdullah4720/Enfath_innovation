<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حفل الإعلان | ابتكار إنفاذ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#001938; --navy2:#00234C; --teal:#00BDC4; --teal-l:#5FE8EC;
  --gold:#C9922A; --gold-l:#E8BA63; --muted:#8FA6BC; --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#00122B}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased}

/* المسرح: 1536×960 بنسبة ثابتة */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% -10%,#00305F,#00122B 62%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 420px at 50% 108%,rgba(0,189,196,.11),transparent 70%)}

.slide{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:54px 70px;text-align:center;
  width:100%;height:100%}
.slide.on{display:flex}

/* الشعارات */
.logos{display:flex;align-items:center;gap:26px;justify-content:center}
.logos img{height:46px;width:auto;display:block}
.logos .sep{width:1px;height:34px;background:var(--line)}

/* الشريحة التمهيدية */
.s-intro .logos{margin-bottom:44px;animation:up .8s ease both}
.s-intro h1{font-size:58px;font-weight:800;margin:0 0 14px;letter-spacing:-1px;
  animation:up .8s .12s ease both;color:#fff;
  max-width:100%;padding:0 10px;line-height:1.3}
@supports (background-clip:text) or (-webkit-background-clip:text){
  .s-intro h1{background:linear-gradient(180deg,#fff 45%,#BBD3E6);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
}
.s-intro .sub{font-size:22px;color:var(--muted);animation:up .8s .24s ease both}
.s-intro .rule{width:132px;height:2px;margin:34px auto;animation:up .8s .34s ease both;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.s-intro .hint{font-size:15px;color:var(--muted);animation:pulseOp 2.4s ease-in-out infinite}

/* شريحة الأرقام */
.s-nums h2{font-size:40px;font-weight:800;margin:0 0 44px;animation:up .7s ease both}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;width:100%;max-width:1060px}
.nbox{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--line);border-radius:20px;padding:30px 22px;
  animation:up .7s ease both}
.nbox .ico{width:52px;height:52px;border-radius:15px;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,189,196,.13);color:var(--teal)}
.nbox .ico svg{width:26px;height:26px}
.nbox .n{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.nbox .l{font-size:15px;color:var(--muted);margin-top:9px}

/* شريحة الفائز */
.s-win .track-tag{font-size:19px;font-weight:700;color:var(--gold);
  background:rgba(201,146,42,.14);border:1px solid rgba(201,146,42,.34);
  padding:9px 26px;border-radius:999px;margin-bottom:38px;
  animation:up .6s ease both}

.rev{display:flex;flex-direction:column;align-items:center}
.rev .cd{font-size:26px;color:var(--muted);letter-spacing:.16em;
  animation:pulseOp 1s ease-in-out infinite}

.win-body{display:none;flex-direction:column;align-items:center}
.win-body.on{display:flex;animation:pop .85s cubic-bezier(.2,.9,.3,1.35) both}

.trophy{width:104px;height:104px;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:30px;
  background:linear-gradient(150deg,var(--gold-l),var(--gold));
  box-shadow:0 0 0 12px rgba(201,146,42,.1), 0 16px 52px rgba(201,146,42,.42);
  animation:float 3.2s ease-in-out infinite}
.trophy svg{width:50px;height:50px;color:#2A1B05;stroke-width:1.5}
.trophy::after{content:"";position:absolute;inset:-26px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,146,42,.34),transparent 70%);
  animation:breathe 3.4s ease-in-out infinite;pointer-events:none}

.rank-lbl{font-size:17px;font-weight:800;color:var(--gold);
  letter-spacing:.26em;margin-bottom:16px}
.team-name{font-size:60px;font-weight:800;line-height:1.25;margin-bottom:18px;
  letter-spacing:-1.4px;color:#fff;text-shadow:0 4px 40px rgba(201,146,42,.34)}
.proj-name{font-size:27px;color:var(--teal-l);font-weight:600;margin-bottom:16px}
.proj-desc{font-size:17px;color:#B8C5D3;line-height:1.9;max-width:790px}

/* شريحة الجميع */
.s-all h2{font-size:38px;font-weight:800;margin:0 0 34px;animation:up .7s ease both}
.all-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;
  width:100%;max-width:1130px}
.acard{background:linear-gradient(160deg,rgba(201,146,42,.16),rgba(255,255,255,.035));
  border:1px solid rgba(201,146,42,.38);border-radius:19px;padding:24px 24px;
  text-align:center;position:relative;overflow:hidden;animation:up .7s ease both}
.acard::after{content:"";position:absolute;top:0;bottom:0;width:52%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  animation:sheen 5s ease-in-out infinite;pointer-events:none}
.acard .medal{width:46px;height:46px;border-radius:50%;margin:0 auto 13px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--gold-l),var(--gold))}
.acard .medal svg{width:23px;height:23px;color:#2A1B05}
.acard .t{font-size:13.5px;color:var(--gold);font-weight:700;margin-bottom:8px}
.acard .n{font-size:25px;font-weight:800;margin-bottom:6px;position:relative}
.acard .p{font-size:15px;color:var(--teal-l);position:relative}

/* التحكم */
.ctrl{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:15px;z-index:60;
  background:rgba(0,18,43,.82);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  transition:opacity .4s}
.ctrl.hide{opacity:0;pointer-events:none}
.nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.18s}
.nav:hover:not(:disabled){background:var(--teal);color:var(--navy);border-color:var(--teal)}
.nav:disabled{opacity:.28;cursor:default}
.nav svg{width:19px;height:19px}
.dots{display:flex;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.24);
  cursor:pointer;transition:.24s}
.dot.on{background:var(--gold);width:26px;border-radius:99px}

.fs{position:fixed;top:22px;left:22px;z-index:60;width:38px;height:38px;
  border-radius:11px;border:1px solid var(--line);background:rgba(0,18,43,.7);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.18s}
.fs:hover{color:#fff;border-color:var(--teal)}
.fs svg{width:17px;height:17px}

/* القصاصات */
.cfti{position:fixed;top:-16px;width:10px;height:17px;z-index:80;
  pointer-events:none;animation:fall linear forwards}

@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
@keyframes sheen{0%{inset-inline-start:-60%}56%,100%{inset-inline-start:132%}}
@keyframes pulseOp{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes fall{to{transform:translateY(108vh) rotate(820deg);opacity:0}}

@media (max-width:1100px){
  .s-intro h1{font-size:44px} .team-name{font-size:42px}
  .nums{grid-template-columns:repeat(2,1fr)} .nbox .n{font-size:40px}
  .all-grid{grid-template-columns:1fr}
  .slide{padding:34px 30px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important}
}
</style>
</head>

<button class="fs" onclick="toggleFs()" title="ملء الشاشة (F)">

</button>

<div id="stage"></div>

<div class="ctrl">
  <button class="nav" id="prev" onclick="show(cur-1)" title="السابق">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="dots" id="dots"></div>
  <button class="nav" id="next" onclick="show(cur+1)" title="التالي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
</div>

const esc = t => String(t ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

let slides = [], cur = 0, winners = [];

/* ── التنقّل ── */
function show(i){
  if(i < 0 || i >= slides.length) return;
  cur = i;
  document.querySelectorAll(".slide").forEach((s, k) => s.classList.toggle("on", k === i));
  document.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("on", k === i));
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === slides.length - 1;

  const s = slides[i];
  if(s.type === "winner") revealWinner(i);
  if(s.type === "all") confetti();
}

/* ── العدّاد التنازلي قبل كشف الاسم ── */
function revealWinner(i){
  const el = document.getElementById(`rev-${i}`);
  const body = document.getElementById(`wb-${i}`);
  if(!el || !body || body.dataset.done) return;

  let n = 3;
  el.style.display = "flex";
  el.querySelector(".cd").textContent = "والفائز هو…";

  clearInterval(window[`_t${i}`]);
  window[`_t${i}`] = setInterval(() => {
    n--;
    if(n <= 0){
      clearInterval(window[`_t${i}`]);
      el.style.display = "none";
      body.classList.add("on");
      body.dataset.done = "1";
      confetti();
    }
  }, 900);
}

/* ── القصاصات ── */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#C9922A","#E8BA63","#00BDC4","#5FE8EC","#ffffff"];
  for(let i = 0; i < 80; i++){
    const d = document.createElement("div");
    d.className = "cfti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (2.8 + Math.random() * 2.6) + "s";
    d.style.animationDelay = (Math.random() * 1.4) + "s";
    d.style.opacity = 0.55 + Math.random() * 0.45;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 7200);
  }
}

      <div class="rev" id="rev-${idx}" style="display:none">
        <div class="cd">والفائز هو…</div>
      </div>
      <div class="win-body" id="wb-${idx}">
        <div class="trophy">${ico("trophy")}</div>
        <div class="rank-lbl">المركز الأول</div>
        <div class="team-name">${esc(w.الفريق)}</div>
        ${w.المشروع ? `<div class="proj-name">${esc(w.المشروع)}</div>` : ""}
        ${w.الوصف ? `<div class="proj-desc">${esc(w.الوصف)}</div>` : ""}
      </div>
    </div>`;
  });

  // ٤ ── الجميع
  slides.push({ type: "all" });
  html += `<div class="slide s-all">
    <h2>الفائزون في تحدي ابتكار إنفاذ</h2>
    <div class="all-grid">
      ${winners.map((w, k) => `
        <div class="acard" style="animation-delay:${0.1 * k + 0.15}s">
          <div class="medal">${ico("award")}</div>
          <div class="t">${esc(w.المسار || "")}</div>
          <div class="n">${esc(w.الفريق)}</div>
          ${w.المشروع ? `<div class="p">${esc(w.المشروع)}</div>` : ""}
        </div>`).join("")}
    </div>
  </div>`;

  stage.innerHTML = html;

  // النقاط
  document.getElementById("dots").innerHTML = slides
    .map((_, i) => `<div class="dot" onclick="show(${i})"></div>`).join("");

  show(0);
}

/* ── لوحة المفاتيح ── */
document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft"  || e.key === " ") { e.preventDefault(); show(cur + 1); }
  if(e.key === "ArrowRight") show(cur - 1);
  if(e.key === "f" || e.key === "F") toggleFs();
  if(e.key === "Home") show(0);
  if(e.key === "End")  show(slides.length - 1);
});

function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

// إخفاء التحكم عند سكون الفأرة
let hideT;
function wake(){
  document.querySelector(".ctrl")?.classList.remove("hide");
  clearTimeout(hideT);
  hideT = setTimeout(() => document.querySelector(".ctrl")?.classList.add("hide"), 3500);
}
document.addEventListener("mousemove", wake);
wake();

build();
</script>

</div>
