<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم هاكاثون إنفاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#0B1F3A;
    --navy-light:#122a52;
    --purple:#5B3E96;
    --teal:#1F9E8E;
    --gold:#C89B3C;
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --ink:#1A1D29;
    --muted:#6B7280;
    --border:#E4E6EF;
    --danger:#C0392B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--bg); color:var(--ink);
  }
  /* ---------- شاشة الدخول ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 55%, var(--purple) 130%);
  }
  .login-card{
    background:var(--card); border-radius:var(--radius); padding:40px 36px;
    width:100%; max-width:380px; box-shadow:0 20px 60px rgba(11,31,58,.35);
  }
  .login-card h1{font-size:20px; margin:0 0 4px; color:var(--navy);}
  .login-card p{color:var(--muted); font-size:13px; margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; color:var(--ink); font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px;
    font-family:inherit; font-size:14px; background:#fafbfc; transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); background:#fff;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:9px; padding:11px 20px; font-family:inherit;
    font-size:14px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-primary:hover{background:#188878;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal); color:var(--teal);}
  .btn-danger{background:#fdeceb; color:var(--danger);}
  .btn-danger:hover{background:var(--danger); color:#fff;}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  #login-error{color:var(--danger); font-size:13px; margin-top:12px; display:none;}

  /* ---------- التصميم العام ---------- */
  #app{display:none; min-height:100vh; grid-template-columns:250px 1fr;}
  #app.active{display:grid;}
  aside{
    background:var(--navy); color:#fff; padding:24px 18px; position:sticky; top:0; height:100vh;
    overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:28px; padding:0 6px;}
  .brand-dot{width:10px; height:10px; border-radius:50%; background:var(--gold);}
  .brand h2{font-size:15px; margin:0; font-weight:700; letter-spacing:.3px;}
  .brand span{display:block; font-size:11px; color:#9db3d6; font-weight:400;}
  nav a{
    display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:9px;
    color:#c8d3e8; text-decoration:none; font-size:13.5px; margin-bottom:3px; cursor:pointer;
    transition:.15s; font-weight:500;
  }
  nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  nav a.active{background:var(--teal); color:#fff;}
  .nav-icon{width:16px; text-align:center; font-size:14px;}
  .logout-box{margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,.12);}
  .logout-box .user-email{font-size:11.5px; color:#9db3d6; margin-bottom:10px; word-break:break-all;}

  main{padding:30px 36px; max-width:1200px;}
  .page-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .page-header h1{font-size:22px; margin:0; color:var(--navy);}
  .page-header p{margin:2px 0 0; color:var(--muted); font-size:13px;}

  .grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--card); border-radius:var(--radius); padding:18px 20px; border:1px solid var(--border);}
  .stat-card .num{font-size:26px; font-weight:700; color:var(--navy);}
  .stat-card .label{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .stat-card.accent{border-right:4px solid var(--teal);}

  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:20px;}
  .card h3{margin:0 0 16px; font-size:15px; color:var(--navy);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:right; padding:10px 12px; color:var(--muted); font-weight:600; font-size:12px; border-bottom:2px solid var(--border);}
  td{padding:11px 12px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-red{background:#fdeceb; color:var(--danger);}
  .badge-gold{background:#fbf3e2; color:var(--gold);}

  .row-actions{display:flex; gap:6px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px;}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(11,19,38,.55);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal{background:#fff; border-radius:var(--radius); padding:26px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 18px; font-size:16px; color:var(--navy);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px; margin-left:18px; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--teal); border-color:var(--teal);}

  .toast{
    position:fixed; bottom:24px; left:24px; background:var(--navy); color:#fff; padding:13px 20px;
    border-radius:9px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.2); z-index:200;
    display:none; align-items:center; gap:8px;
  }
  .toast.show{display:flex;}
  .toast.error{background:var(--danger);}

  .loader{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:820px){
    #app.active{grid-template-columns:1fr;}
    aside{position:relative; height:auto;}
    main{padding:20px;}
  }
</style>
</head>
<body>

<!-- ============== شاشة تسجيل الدخول ============== -->
<div id="login-screen">
  <div class="login-card">
    <h1>لوحة تحكم هاكاثون إنفاذ</h1>
    <p>الدخول مخصص لفريق الإدارة والتنسيق فقط</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">تسجيل الدخول</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ============== التطبيق ============== -->
<div id="app">
  <aside>
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h2>هاكاثون إنفاذ</h2>
        <span>لوحة التحكم الإدارية</span>
      </div>
    </div>
    <nav id="nav-menu">
      <a data-page="overview" class="active">📊 &nbsp;نظرة عامة</a>
      <a data-page="tracks">🧭 &nbsp;المسارات</a>
      <a data-page="teams">👥 &nbsp;الفرق</a>
      <a data-page="prep">🎓 &nbsp;جلسات التحضير</a>
      <a data-page="announcements">📢 &nbsp;التحديثات والملفات</a>
      <a data-page="judging">⚖️ &nbsp;التحكيم</a>
      <a data-page="events">📍 &nbsp;الفعاليات والحضور</a>
      <a data-page="certificates">🏅 &nbsp;الشهادات</a>
      <a data-page="surveys">📋 &nbsp;الاستبيانات والرضا</a>
      <a data-page="users">🔐 &nbsp;المستخدمون والأدوار</a>
    </nav>
    <div class="logout-box">
      <div class="user-email" id="current-user-email"></div>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </aside>

  <main id="main-content">
    <!-- يُملأ ديناميكيًا -->
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   إعدادات الاتصال بـ Supabase
   عدّل القيمتين التاليتين قبل النشر — تجدهما في:
   Supabase Dashboard → Project Settings → API
   ============================================================ */
const SUPABASE_URL = "https://tuyomqhvdjpsayecystf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2o8HsyqGXPFoQbHn3EfFQ_LqK1qpYA";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentPage = "overview";

/* ---------------- أدوات مساعدة عامة ---------------- */
function showToast(msg, isError=false){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(()=> t.className = "toast", 2800);
}
function openModal(html){
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("active");
}
function closeModal(){
  document.getElementById("modal-overlay").classList.remove("active");
}
document.getElementById("modal-overlay").addEventListener("click", (e)=>{
  if(e.target.id === "modal-overlay") closeModal();
});
function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("ar-SA", {dateStyle:"medium", timeStyle:"short"});
}

/* ---------------- المصادقة ---------------- */
async function handleLogin(){
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-btn");
  const errBox = document.getElementById("login-error");
  errBox.style.display = "none";

  if(!email || !password){
    errBox.textContent = "الرجاء تعبئة البريد وكلمة المرور";
    errBox.style.display = "block";
    return;
  }
  btn.innerHTML = '<span class="loader"></span>';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    btn.textContent = "تسجيل الدخول";
    errBox.textContent = "بيانات الدخول غير صحيحة";
    errBox.style.display = "block";
    return;
  }

  // التحقق من صلاحية admin أو coordinator
  const { data: roles } = await sb
    .from("user_roles")
    .select("roles(key)")
    .eq("user_id", data.user.id);

  const roleKeys = (roles || []).map(r => r.roles?.key);
  if(!roleKeys.includes("admin") && !roleKeys.includes("coordinator")){
    await sb.auth.signOut();
    btn.textContent = "تسجيل الدخول";
    errBox.textContent = "هذا الحساب لا يملك صلاحية الوصول للوحة التحكم";
    errBox.style.display = "block";
    return;
  }

  currentUser = data.user;
  document.getElementById("current-user-email").textContent = currentUser.email;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("active");
  navigateTo("overview");
}

async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("app").classList.remove("active");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-password").value = "";
}

// استعادة الجلسة عند إعادة تحميل الصفحة
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", currentUser.id);
    const roleKeys = (roles || []).map(r => r.roles?.key);
    if(roleKeys.includes("admin") || roleKeys.includes("coordinator")){
      document.getElementById("current-user-email").textContent = currentUser.email;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").classList.add("active");
      navigateTo("overview");
    }
  }
}
restoreSession();

/* ---------------- التنقل ---------------- */
document.getElementById("nav-menu").addEventListener("click", (e)=>{
  const link = e.target.closest("a[data-page]");
  if(!link) return;
  navigateTo(link.dataset.page);
});
function navigateTo(page){
  currentPage = page;
  document.querySelectorAll("#nav-menu a").forEach(a=>{
    a.classList.toggle("active", a.dataset.page === page);
  });
  const renderers = {
    overview: renderOverview,
    tracks: renderTracks,
    teams: renderTeams,
    prep: renderPrep,
    announcements: renderAnnouncements,
    judging: renderJudging,
    events: renderEvents,
    certificates: renderCertificates,
    surveys: renderSurveys,
    users: renderUsers,
  };
  (renderers[page] || renderOverview)();
}

/* ============================================================
   1. نظرة عامة
   ============================================================ */
async function renderOverview(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="page-header"><div><h1>نظرة عامة</h1><p>مؤشرات عامة عن سير البرنامج</p></div></div>
    <div class="grid-stats" id="stats-grid">جاري التحميل...</div>
    <div class="card">
      <h3>الرضا حسب المرحلة</h3>
      <div id="satisfaction-table">جاري التحميل...</div>
    </div>`;

  const { data: stats, error } = await sb.from("dashboard_stats").select("*").single();
  if(error){
    document.getElementById("stats-grid").innerHTML = `<div class="empty-state">تعذّر تحميل الإحصائيات: ${esc(error.message)}</div>`;
  } else {
    document.getElementById("stats-grid").innerHTML = `
      ${statCard(stats.total_users, "إجمالي المستخدمين")}
      ${statCard(stats.total_participants, "المشاركون")}
      ${statCard(stats.confirmed_teams + " / " + stats.total_teams, "الفرق المؤكدة")}
      ${statCard(stats.active_tracks, "المسارات النشطة")}
      ${statCard(stats.certificates_issued, "الشهادات الصادرة")}
      ${statCard(stats.avg_nps ?? "—", "متوسط الرضا (NPS)", true)}
    `;
  }

  const { data: sat } = await sb.from("satisfaction_by_stage").select("*");
  const satBox = document.getElementById("satisfaction-table");
  if(!sat || sat.length === 0){
    satBox.innerHTML = `<div class="empty-state">لا توجد استجابات استبيانات بعد</div>`;
  } else {
    satBox.innerHTML = `<table><thead><tr>
      <th>الاستبيان</th><th>المرحلة</th><th>عدد الردود</th><th>متوسط NPS</th><th>نسبة المروّجين</th>
      </tr></thead><tbody>
      ${sat.map(s => `<tr>
        <td>${esc(s.survey_title)}</td>
        <td>${esc(s.target_stage)}</td>
        <td>${s.responses_count}</td>
        <td>${s.avg_nps ?? "—"}</td>
        <td>${s.promoters_pct ?? "—"}%</td>
      </tr>`).join("")}
      </tbody></table>`;
  }
}
function statCard(num, label, accent=false){
  return `<div class="stat-card ${accent ? 'accent' : ''}"><div class="num">${num ?? "—"}</div><div class="label">${label}</div></div>`;
}

/* ============================================================
   2. المسارات
   ============================================================ */
async function renderTracks(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="page-header">
      <div><h1>المسارات</h1><p>إدارة مسارات الهاكاثون والحد الأدنى/الأقصى لحجم الفريق</p></div>
      <button class="btn btn-primary" onclick="openTrackModal()">+ إضافة مسار</button>
    </div>
    <div class="card"><div id="tracks-table">جاري التحميل...</div></div>`;

  const { data, error } = await sb.from("tracks").select("*").order("display_order");
  const box = document.getElementById("tracks-table");
  if(error) return box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`;
  if(!data.length) return box.innerHTML = `<div class="empty-state">لا توجد مسارات بعد. أضف أول مسار.</div>`;

  box.innerHTML = `<table><thead><tr>
    <th>المسار</th><th>حجم الفريق</th><th>التسجيل</th><th>الحالة</th><th></th>
    </tr></thead><tbody>
    ${data.map(t => `<tr>
      <td><strong>${esc(t.name_ar)}</strong><br><span style="color:var(--muted);font-size:12px">${esc(t.description||"")}</span></td>
      <td>${t.min_team_size}–${t.max_team_size}</td>
      <td>${t.registration_open ? '<span class="badge badge-green">مفتوح</span>' : '<span class="badge badge-gray">مغلق</span>'}</td>
      <td>${t.is_active ? '<span class="badge badge-green">نشط</span>' : '<span class="badge badge-gray">غير نشط</span>'}</td>
      <td class="row-actions">
        <button class="btn btn-outline btn-sm" onclick='openTrackModal(${JSON.stringify(t)})'>تعديل</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRow('tracks','${t.id}', renderTracks)">حذف</button>
      </td>
    </tr>`).join("")}
    </tbody></table>`;
}
function openTrackModal(t=null){
  const isEdit = !!t;
  t = t || {name_ar:"",name_en:"",description:"",min_team_size:2,max_team_size:5,registration_open:true,is_active:true,display_order:0};
  openModal(`
    <h3>${isEdit ? "تعديل مسار" : "إضافة مسار جديد"}</h3>
    <div class="field"><label>اسم المسار (عربي)</label><input id="f-name-ar" value="${esc(t.name_ar)}"></div>
    <div class="field"><label>اسم المسار (إنجليزي)</label><input id="f-name-en" value="${esc(t.name_en)}"></div>
    <div class="field"><label>الوصف</label><textarea id="f-desc" rows="2">${esc(t.description)}</textarea></div>
    <div class="form-row-2">
      <div class="field"><label>الحد الأدنى للفريق</label><input type="number" id="f-min" value="${t.min_team_size}"></div>
      <div class="field"><label>الحد الأقصى للفريق</label><input type="number" id="f-max" value="${t.max_team_size}"></div>
    </div>
    <div class="field"><label>ترتيب العرض</label><input type="number" id="f-order" value="${t.display_order}"></div>
    <div class="form-row-2">
      <div class="field"><label><input type="checkbox" id="f-reg" ${t.registration_open?"checked":""}> التسجيل مفتوح</label></div>
      <div class="field"><label><input type="checkbox" id="f-active" ${t.is_active?"checked":""}> نشط</label></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveTrack('${t.id||""}')">حفظ</button>
    </div>
  `);
}
async function saveTrack(id){
  const payload = {
    name_ar: document.getElementById("f-name-ar").value.trim(),
    name_en: document.getElementById("f-name-en").value.trim(),
    description: document.getElementById("f-desc").value.trim(),
    min_team_size: parseInt(document.getElementById("f-min").value) || 2,
    max_team_size: parseInt(document.getElementById("f-max").value) || 5,
    display_order: parseInt(document.getElementById("f-order").value) || 0,
    registration_open: document.getElementById("f-reg").checked,
    is_active: document.getElementById("f-active").checked,
  };
  if(!payload.name_ar){ showToast("اسم المسار مطلوب", true); return; }

  const q = id ? sb.from("tracks").update(payload).eq("id", id) : sb.from("tracks").insert(payload);
  const { error } = await q;
  if(error) return showToast("خطأ: " + error.message, true);
  showToast("تم الحفظ بنجاح");
  closeModal();
  renderTracks();
}

/* ============================================================
   3. الفرق
   ============================================================ */
async function renderTeams(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="page-header"><div><h1>الفرق</h1><p>متابعة حالة الفرق المسجلة عبر جميع المسارات</p></div></div>

async function openPrepModal(p=null){

async function savePrep(id){
  const dateVal = document.getElementById("f-date").value;
  if(!dateVal){ showToast("الموعد مطلوب", true); return; }
  const payload = {
    title: document.getElementById("f-title").value.trim(),
    track_id: document.getElementById("f-track").value || null,
    session_date: new Date(dateVal).toISOString(),
    duration_minutes: parseInt(document.getElementById("f-duration").value) || 60,
    capacity: document.getElementById("f-capacity").value ? parseInt(document.getElementById("f-capacity").value) : null,
    location: document.getElementById("f-location").value.trim(),
  };
  if(!payload.title){ showToast("عنوان الجلسة مطلوب", true); return; }
  const q = id ? sb.from("prep_sessions").update(payload).eq("id", id) : sb.from("prep_sessions").insert(payload);
  const { error } = await q;
  if(error) return showToast("خطأ: " + error.message, true);
  showToast("تم الحفظ بنجاح");
  closeModal();
  renderPrep();
}

  const box2 = document.getElementById("certs-issued");
  if(!issued || !issued.length) box2.innerHTML = `<div class="empty-state">لم تُصدر شهادات بعد</div>`;
  else box2.innerHTML = `<table><thead><tr><th>المستفيد</th><th>النوع</th><th>تاريخ الإصدار</th><th>رمز التحقق</th></tr></thead><tbody>
    ${issued.map(c => `<tr>
      <td>${esc(c.profiles?.full_name||"—")}</td>
      <td>${esc(c.certificate_types?.name_ar||"—")}</td>
      <td>${fmtDate(c.issued_at)}</td>
      <td><code style="font-size:11px">${esc(c.verification_code)}</code></td>
    </tr>`).join("")}
    </tbody></table>`;
}
function openCertTypeModal(){
  openModal(`
    <h3>إضافة نوع شهادة</h3>
    <div class="field"><label>المفتاح (بالإنجليزي، بدون مسافات)</label><input id="f-cert-key" placeholder="مثال: participation"></div>
    <div class="field"><label>الاسم بالعربي</label><input id="f-cert-name" placeholder="مثال: شهادة مشاركة"></div>
    <div class="field"><label>الحد الأدنى لنسبة الحضور (%)</label><input type="number" id="f-cert-attendance" value="50"></div>
    <div class="field"><label><input type="checkbox" id="f-cert-survey"> يشترط تعبئة استبيان</label></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveCertType()">حفظ</button>
    </div>
  `);
}
async function saveCertType(){
  const key = document.getElementById("f-cert-key").value.trim();
  const name_ar = document.getElementById("f-cert-name").value.trim();
  const min_attendance_pct = parseFloat(document.getElementById("f-cert-attendance").value) || 0;
  const requires_survey = document.getElementById("f-cert-survey").checked;
  if(!key || !name_ar){ showToast("المفتاح والاسم مطلوبان", true); return; }
  const { error } = await sb.from("certificate_types").insert({key, name_ar, min_attendance_pct, requires_survey});
  if(error) return showToast("خطأ: " + error.message, true);
  showToast("تمت الإضافة");
  closeModal();
  renderCertificates();
}

/* ============================================================
   8. الاستبيانات
   ============================================================ */
async function renderSurveys(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="page-header"><div><h1>الاستبيانات وقياس الرضا</h1><p>استبيانات كل مرحلة ونتائجها المجمّعة</p></div></div>
    <div class="card"><div id="surveys-table">جاري التحميل...</div></div>`;

  const { data, error } = await sb.from("surveys").select("*, survey_responses(count)").order("created_at", {ascending:false});
  const box = document.getElementById("surveys-table");
  if(error) return box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`;
  if(!data.length) return box.innerHTML = `<div class="empty-state">لا توجد استبيانات بعد</div>`;

  box.innerHTML = `<table><thead><tr>
    <th>الاستبيان</th><th>المرحلة</th><th>الحالة</th><th>عدد الردود</th>
    </tr></thead><tbody>
    ${data.map(s => `<tr>
      <td><strong>${esc(s.title)}</strong></td>
      <td>${esc(s.target_stage)}</td>
      <td>${s.is_active ? '<span class="badge badge-green">نشط</span>' : '<span class="badge badge-gray">متوقف</span>'}</td>
      <td>${s.survey_responses?.[0]?.count ?? 0}</td>
    </tr>`).join("")}
    </tbody></table>
    <p style="color:var(--muted);font-size:12.5px;margin-top:14px">لإنشاء استبيان جديد بأسئلة مخصصة، استخدم SQL Editor في Supabase — الأسئلة تُخزَّن بصيغة JSON مرنة (questions_json).</p>`;
}

/* ============================================================
   9. المستخدمون والأدوار
   ============================================================ */
async function renderUsers(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="page-header">
      <div><h1>المستخدمون والأدوار</h1><p>ابحث عن مستخدم وأدر أدواره (يمكن تعدد الأدوار لنفس الشخص)</p></div>
    </div>
    <div class="card">
      <div class="field"><label>البحث بالبريد الإلكتروني أو الاسم</label>
        <input id="user-search" placeholder="اكتب للبحث..." oninput="debouncedUserSearch()">
      </div>
      <div id="users-table"></div>
    </div>`;
  document.getElementById("users-table").innerHTML = `<div class="empty-state">ابدأ بالبحث عن مستخدم لعرض أدواره</div>`;
}
let userSearchTimer;
function debouncedUserSearch(){
  clearTimeout(userSearchTimer);
  userSearchTimer = setTimeout(searchUsers, 400);
}
async function searchUsers(){
  const term = document.getElementById("user-search").value.trim();
  const box = document.getElementById("users-table");
  if(!term){ box.innerHTML = `<div class="empty-state">ابدأ بالبحث عن مستخدم لعرض أدواره</div>`; return; }

  const { data, error } = await sb.from("profiles")
    .select("id, full_name, email, organization, user_roles(id, roles(key, name_ar), track_id)")
    .or(`full_name.ilike.%${term}%,email.ilike.%${term}%`)
    .limit(20);

  if(error) return box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`;
  if(!data.length) return box.innerHTML = `<div class="empty-state">لا توجد نتائج</div>`;

  box.innerHTML = `<table><thead><tr><th>الاسم</th><th>البريد</th><th>الجهة</th><th>الأدوار الحالية</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr>
      <td>${esc(u.full_name)}</td>
      <td>${esc(u.email)}</td>
      <td>${esc(u.organization||"—")}</td>
      <td>${(u.user_roles||[]).map(r => `<span class="badge badge-green" style="margin-left:4px">${esc(r.roles?.name_ar||"")}</span>`).join("") || "—"}</td>
      <td><button class="btn btn-outline btn-sm" onclick='openAssignRoleModal("${u.id}", ${JSON.stringify(u.full_name)})'>+ إضافة دور</button></td>
    </tr>`).join("")}
    </tbody></table>`;
}
async function openAssignRoleModal(userId, userName){
  const { data: roles } = await sb.from("roles").select("*");
  openModal(`
    <h3>إضافة دور لـ ${esc(userName)}</h3>
    <div class="field"><label>الدور</label>
      <select id="f-role-select">${(roles||[]).map(r=>`<option value="${r.id}">${esc(r.name_ar)}</option>`).join("")}</select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="assignRole('${userId}')">إضافة</button>
    </div>
  `);
}
async function assignRole(userId){
  const roleId = document.getElementById("f-role-select").value;
  const { error } = await sb.from("user_roles").insert({user_id:userId, role_id:roleId});
  if(error) return showToast("خطأ: " + error.message, true);
  showToast("تم إضافة الدور");
  closeModal();
  searchUsers();
}

/* ---------------- حذف عام ---------------- */
async function deleteRow(table, id, refreshFn){
  if(!confirm("هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.")) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if(error) return showToast("خطأ: " + error.message, true);
  showToast("تم الحذف");
  refreshFn();
}
</script>
</body>
</html>
