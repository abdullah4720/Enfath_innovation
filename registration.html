<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل | هاكاثون إنفاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#0B1F3A; --navy-light:#122a52; --purple:#5B3E96; --teal:#1F9E8E;
    --gold:#C89B3C; --bg:#F5F6FA; --card:#FFFFFF; --ink:#1A1D29; --muted:#6B7280;
    --border:#E4E6EF; --danger:#C0392B; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  .hero{
    background:radial-gradient(circle at 20% 15%, rgba(91,62,150,.55), transparent 45%),
               linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #0e2745 100%);
    color:#fff; padding:52px 20px 70px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; inset:0; opacity:.08; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size:42px 42px;
  }
  .hero-content{position:relative; z-index:1; max-width:640px; margin:0 auto;}
  .eyebrow{display:inline-block; background:rgba(31,158,142,.18); color:#5fe4cf; border:1px solid rgba(31,158,142,.4);
    padding:5px 16px; border-radius:20px; font-size:12.5px; font-weight:600; margin-bottom:18px;}
  .hero h1{font-size:clamp(26px,4vw,36px); margin:0 0 10px; font-weight:800;}
  .hero p{color:#c8d3e8; font-size:15px; margin:0; line-height:1.7;}

  .wrap{max-width:560px; margin:-40px auto 60px; padding:0 20px; position:relative; z-index:2;}
  .panel{background:var(--card); border-radius:var(--radius); padding:32px 28px; box-shadow:0 24px 60px rgba(11,31,58,.16); border:1px solid var(--border);}

  h2{font-size:19px; margin:0 0 4px; color:var(--navy);}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 24px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px;
    font-family:inherit; font-size:14px; background:#fafbfc; transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--teal); background:#fff;}
  .field input.field-invalid{border-color:var(--danger); background:#fdf5f4;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px;
    padding:13px 22px; font-family:inherit; font-size:14.5px; font-weight:600; cursor:pointer; transition:.15s; width:100%;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:#188878;}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal); color:var(--teal);}
  .btn-link{background:none; border:none; color:var(--teal); cursor:pointer; font-size:13px; font-family:inherit; font-weight:600; padding:0;}

  .switcher{display:flex; gap:8px; margin-bottom:24px; background:#f0f1f5; padding:4px; border-radius:11px;}
  .switcher button{flex:1; padding:9px; border:none; border-radius:8px; background:none; font-family:inherit;
    font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;}
  .switcher button.active{background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .alert{padding:11px 14px; border-radius:9px; font-size:13px; margin-bottom:16px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .loader{width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* لوحة المشارك بعد الدخول */
  #dash-screen{display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center; max-width:800px; margin:0 auto 20px; padding:20px 20px 0;}
  .topbar .who{font-size:13px; color:var(--muted);}
  .topbar .who strong{color:var(--ink);}
  .dash-wrap{max-width:800px; margin:0 auto; padding:0 20px 60px;}

  .status-badge{display:inline-block; padding:4px 13px; border-radius:20px; font-size:12px; font-weight:600;}
  .status-pending{background:#fbf3e2; color:var(--gold);}
  .status-confirmed{background:#e6f7f3; color:var(--teal);}
  .status-disqualified{background:#fdeceb; color:var(--danger);}
  .status-withdrawn{background:#f0f1f5; color:var(--muted);}

  .track-option{
    border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.15s;
  }
  .track-option.selected{border-color:var(--teal); background:#f2fbf9;}
  .track-option h4{margin:0 0 3px; font-size:14px;}
  .track-option p{margin:0; font-size:12.5px; color:var(--muted);}

  .member-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
  .leader-tag{font-size:11px; background:var(--purple); color:#fff; padding:2px 9px; border-radius:12px; margin-right:6px;}

  .invite-box{background:#f2fbf9; border:1px dashed var(--teal); border-radius:12px; padding:16px; text-align:center; margin-bottom:20px;}
  .invite-code{font-size:22px; font-weight:800; letter-spacing:3px; color:var(--navy); margin:8px 0;}

  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:24px; margin-bottom:18px;}

  .dash-tabs{display:flex; gap:4px; background:#eef0f6; padding:4px; border-radius:12px; margin-bottom:20px; overflow-x:auto;}
  .dash-tab{flex:1; white-space:nowrap; padding:10px 14px; border:none; border-radius:9px; background:none; font-family:inherit;
    font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;}
  .dash-tab.active{background:#fff; color:var(--navy); box-shadow:0 1px 5px rgba(0,0,0,.08);}

  .eligible-yes{color:var(--teal); font-weight:600;}
  .eligible-no{color:var(--muted);}
  .progress-bar{background:#eef0f6; border-radius:20px; height:8px; overflow:hidden; margin:6px 0;}
  .progress-fill{background:var(--teal); height:100%; border-radius:20px; transition:.3s;}

  .announcement-item{border-bottom:1px solid var(--border); padding:16px 0;}
  .announcement-item:last-child{border-bottom:none;}
  .announcement-item h4{margin:0 0 4px; font-size:14.5px;}
  .announcement-item .meta{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .announcement-item p{margin:0; font-size:13.5px; color:var(--ink); line-height:1.6;}
  .pin-flag{color:var(--gold); margin-left:4px;}

  .cert-item{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border);}
  .cert-item:last-child{border-bottom:none;}
  .cert-item h4{margin:0 0 4px; font-size:14px;}
  .cert-item .meta{font-size:12px; color:var(--muted);}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <a href="./index.html" style="display:inline-block;color:#9db3d6;font-size:12.5px;margin-bottom:14px;text-decoration:none">← الصفحة الرئيسية</a>
    <span class="eyebrow">جامعة القصيم × إنفاذ</span>
    <h1>هاكاثون إنفاذ</h1>
    <p>سجّل فريقك أو انضم لفريق قائم، واختر مسارك، وابدأ رحلتك في تطوير حلول رقمية تخدم القطاع القضائي.</p>
  </div>
</div>

<!-- ============== شاشة الدخول/التسجيل ============== -->
<div id="auth-screen" class="wrap">
  <div class="panel">
    <div class="switcher">
      <button id="tab-signup" class="active" onclick="switchAuthTab('signup')">حساب جديد</button>
      <button id="tab-login" onclick="switchAuthTab('login')">لدي حساب</button>
    </div>

    <div id="auth-alert" class="alert"></div>

    <!-- تسجيل جديد -->
    <div id="signup-form">
      <h2>إنشاء حساب مشارك</h2>
      <p class="sub">خطوة واحدة، ثم تختار مسارك وتنشئ فريقك أو تنضم لفريق</p>
      <div class="field"><label>الاسم الكامل</label><input id="su-name" placeholder="الاسم الثلاثي"></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="su-email"></div>
      <div class="field"><label>رقم الجوال</label><input id="su-phone" placeholder="05xxxxxxxx"></div>
      <div class="field"><label>الجهة (جامعة / شركة / جهة حكومية)</label><input id="su-org"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="su-password"></div>
      <button class="btn btn-primary" id="su-btn" onclick="handleSignup()">إنشاء الحساب والمتابعة</button>
    </div>

    <!-- تسجيل دخول -->
    <div id="login-form" style="display:none">
      <h2>تسجيل الدخول</h2>
      <p class="sub">أدخل بياناتك للمتابعة لفريقك</p>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="li-email"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="li-password"></div>
      <button class="btn btn-primary" id="li-btn" onclick="handleLogin()">تسجيل الدخول</button>
    </div>
  </div>
</div>

<!-- ============== لوحة المشارك ============== -->
<div id="dash-screen">
  <div class="topbar">
    <div class="who">مرحبًا، <strong id="dash-name"></strong></div>
    <div style="display:flex; align-items:center; gap:14px">
      <div style="position:relative">
        <button class="btn-link" onclick="toggleNotifPanel()" style="font-size:16px; position:relative">
          🔔<span id="notif-badge" style="display:none; position:absolute; top:-4px; left:-6px; background:var(--danger); color:#fff; border-radius:50%; width:16px; height:16px; font-size:9.5px; align-items:center; justify-content:center"></span>
        </button>
        <div id="notif-panel" style="display:none; position:absolute; left:0; top:32px; width:300px; max-height:360px; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(11,31,58,.15); z-index:50;"></div>
      </div>
      <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </div>
  <div class="dash-wrap" id="dash-content"></div>
</div>

<script>
/* ============================================================
   إعدادات الاتصال بـ Supabase — عدّلها قبل النشر
   ============================================================ */
const SUPABASE_URL = "https://tuyomqhvdjpsayecystf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2o8HsyqGXPFoQbHn3EfFQ_LqK1qpYA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showAlert(msg, type="error"){
  const box = document.getElementById("auth-alert");
  box.textContent = msg;
  box.className = "alert " + type;
}
function clearAlert(){
  document.getElementById("auth-alert").className = "alert";
}
function switchAuthTab(tab){
  clearAlert();
  document.getElementById("tab-signup").classList.toggle("active", tab==="signup");
  document.getElementById("tab-login").classList.toggle("active", tab==="login");
  document.getElementById("signup-form").style.display = tab==="signup" ? "block" : "none";
  document.getElementById("login-form").style.display = tab==="login" ? "block" : "none";
}

/* ---------------- إنشاء حساب ---------------- */
function validateSignupFields(){
  const fields = {
    "su-name": v => v.trim().length >= 4 ? null : "الاسم الكامل مطلوب (4 أحرف على الأقل)",
    "su-email": v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : "صيغة البريد الإلكتروني غير صحيحة",
    "su-phone": v => /^(05|5)\d{8}$/.test(v.trim().replace(/\s|-/g,"")) ? null : "رقم الجوال يجب أن يكون بصيغة سعودية صحيحة (05xxxxxxxx)",
    "su-org": v => v.trim().length >= 2 ? null : "الجهة مطلوبة",
    "su-password": v => v.length >= 6 ? null : "كلمة المرور يجب ألا تقل عن 6 أحرف",
  };
  document.querySelectorAll("#signup-form input").forEach(el => el.classList.remove("field-invalid"));

  for(const [id, check] of Object.entries(fields)){
    const el = document.getElementById(id);
    const err = check(el.value);
    if(err){
      el.classList.add("field-invalid");
      el.focus();
      return err;
    }
  }
  return null;
}

async function handleSignup(){
  clearAlert();
  const validationError = validateSignupFields();
  if(validationError){ showAlert(validationError); return; }

  const full_name = document.getElementById("su-name").value.trim();
  const email = document.getElementById("su-email").value.trim();
  let phone = document.getElementById("su-phone").value.trim().replace(/\s|-/g,"");
  if(phone.startsWith("5")) phone = "0" + phone;
  const organization = document.getElementById("su-org").value.trim();
  const password = document.getElementById("su-password").value;

  const btn = document.getElementById("su-btn");
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name, phone, organization } }
  });
  if(error){
    btn.disabled = false; btn.textContent = "إنشاء الحساب والمتابعة";
    showAlert(error.message.includes("already") ? "هذا البريد مسجّل مسبقًا، جرّب تسجيل الدخول" : "تعذّر إنشاء الحساب: " + error.message);
    return;
  }

  // ملاحظة: الملف الشخصي والدور يُنشآن تلقائيًا عبر trigger بقاعدة البيانات
  // (راجع 06_auth_trigger.sql) — لا حاجة لإدخال يدوي هنا

  if(!data.session){
    btn.disabled = false; btn.textContent = "إنشاء الحساب والمتابعة";
    showAlert("تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.", "success");
    return;
  }

  currentUser = data.user;
  await loadProfile();
  showSignupSuccessThenDashboard();
}

function showSignupSuccessThenDashboard(){
  document.getElementById("auth-screen").style.display = "none";
  document.querySelector(".hero").style.display = "none";
  const dashScreen = document.getElementById("dash-screen");
  dashScreen.style.display = "block";
  document.getElementById("dash-name").textContent = currentProfile?.full_name || currentUser.email;
  const content = document.getElementById("dash-content");
  content.innerHTML = `
    <div class="card" style="text-align:center;padding:40px 24px">
      <div style="font-size:40px;margin-bottom:10px">✅</div>
      <h2 style="margin-bottom:6px">تم إنشاء حسابك بنجاح</h2>
      <p class="sub" style="margin-bottom:22px">مرحبًا ${esc(currentProfile?.full_name || "")}، الخطوة التالية اختيار مسارك وإنشاء فريقك أو الانضمام لفريق قائم</p>
      <button class="btn btn-primary" style="width:auto;padding:12px 28px" onclick="renderDashboard()">متابعة إلى فريقي</button>
    </div>
  `;
}

/* ---------------- تسجيل الدخول ---------------- */
async function handleLogin(){
  clearAlert();
  const email = document.getElementById("li-email").value.trim();
  const password = document.getElementById("li-password").value;
  if(!email || !password){ showAlert("البريد وكلمة المرور مطلوبان"); return; }

  const btn = document.getElementById("li-btn");
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
    showAlert("بيانات الدخول غير صحيحة");
    return;
  }
  currentUser = data.user;
  await loadProfile();
  showDashboard();
}

async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  document.getElementById("dash-screen").style.display = "none";
  document.getElementById("auth-screen").style.display = "block";
  document.querySelector(".hero").style.display = "block";
}

async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    await loadProfile();
    showDashboard();
  }
}
restoreSession();

async function loadProfile(){
  const { data } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  currentProfile = data;
}

function showDashboard(){
  document.getElementById("auth-screen").style.display = "none";
  document.querySelector(".hero").style.display = "none";
  document.getElementById("dash-screen").style.display = "block";
  document.getElementById("dash-name").textContent = currentProfile?.full_name || currentUser.email;
  renderDashboard();
  initNotifications();
}

/* ---------------- الإشعارات ---------------- */
let notifItems = [];
async function initNotifications(){
  await loadNotifications();
  sb.channel("notifications-" + currentUser.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${currentUser.id}` }, () => {
      loadNotifications();
    })
    .subscribe();
}
async function loadNotifications(){
  const { data } = await sb.from("notifications").select("*").eq("user_id", currentUser.id).order("created_at", {ascending:false}).limit(30);
  notifItems = data || [];
  const unread = notifItems.filter(n => !n.is_read).length;
  const badge = document.getElementById("notif-badge");
  if(unread > 0){ badge.style.display = "flex"; badge.textContent = unread > 9 ? "9+" : unread; }
  else badge.style.display = "none";
  renderNotifPanel();
}
function renderNotifPanel(){
  const panel = document.getElementById("notif-panel");
  if(!notifItems.length){
    panel.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">لا توجد إشعارات بعد</div>`;
    return;
  }
  panel.innerHTML = notifItems.map(n => `
    <div onclick="markNotifRead('${n.id}')" style="padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;${n.is_read?'':'background:#f2fbf9'}">
      <div style="font-size:13px;font-weight:600">${esc(n.title)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(n.body||"")}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">${fmtDate(n.created_at)}</div>
    </div>
  `).join("");
}
function toggleNotifPanel(){
  const panel = document.getElementById("notif-panel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}
document.addEventListener("click", (e) => {
  const panel = document.getElementById("notif-panel");
  if(panel && !e.target.closest("#notif-panel") && !e.target.closest('[onclick="toggleNotifPanel()"]')){
    panel.style.display = "none";
  }
});
async function markNotifRead(id){
  await sb.from("notifications").update({ is_read: true }).eq("id", id);
  loadNotifications();
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("ar-SA", {dateStyle:"medium", timeStyle:"short"});
}

/* ---------------- لوحة المشارك الرئيسية (بتبويبات) ---------------- */
let dashTab = "team";
let cachedMembership = null;

async function renderDashboard(){
  const content = document.getElementById("dash-content");
  content.innerHTML = `
    <div id="countdown-box" class="card" style="text-align:center; padding:16px; margin-bottom:14px; display:none">
      <div class="hint" style="margin-bottom:4px">⏳ العد التنازلي ليوم الهاكاثون</div>
      <div id="countdown-value" style="font-size:20px; font-weight:800; color:var(--navy)"></div>
    </div>
    <div class="dash-tabs" id="dash-tabs-bar">
      <button class="dash-tab ${dashTab==='team'?'active':''}" data-t="team">فريقي</button>
      <button class="dash-tab ${dashTab==='chat'?'active':''}" data-t="chat">دردشة الفريق</button>
      <button class="dash-tab ${dashTab==='prep'?'active':''}" data-t="prep">التحضير</button>
      <button class="dash-tab ${dashTab==='mentorship'?'active':''}" data-t="mentorship">الإرشاد</button>
      <button class="dash-tab ${dashTab==='judging'?'active':''}" data-t="judging">معايير التحكيم</button>
      <button class="dash-tab ${dashTab==='certs'?'active':''}" data-t="certs">الشهادات</button>
      <button class="dash-tab ${dashTab==='updates'?'active':''}" data-t="updates">التحديثات والملفات</button>
    </div>
    <div id="dash-tab-body"><div class="card">جاري التحميل...</div></div>
  `;
  document.getElementById("dash-tabs-bar").addEventListener("click", (e)=>{
    const btn = e.target.closest(".dash-tab");

/* ---------------- العداد التنازلي ---------------- */
let countdownTimer = null;
async function initCountdown(){
  const { data } = await sb.from("platform_settings").select("value").eq("key","hackathon_start_date").maybeSingle();
  const box = document.getElementById("countdown-box");
  const valueEl = document.getElementById("countdown-value");
  if(!data?.value){ box.style.display = "none"; return; }
  const target = new Date(data.value).getTime();

  function tick(){
    const now = Date.now();
    const diff = target - now;
    if(diff <= 0){
      valueEl.textContent = "بدأ الهاكاثون! 🎉";
      clearInterval(countdownTimer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    valueEl.textContent = `${d} يوم · ${h} ساعة · ${m} دقيقة`;
  }
  box.style.display = "block";
  tick();
  clearInterval(countdownTimer);
  countdownTimer = setInterval(tick, 60000);
}

let chatChannel = null;
function subscribeTeamChat(teamId){
  if(chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel("team-chat-" + teamId)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "team_messages", filter: `team_id=eq.${teamId}` }, () => {
      loadTeamMessages(teamId);

    .subscribe();
}

        <span class="hint">نسبة الحضور ${pct}% (المطلوب ${req}%)${t.requires_survey ? (elig?.survey_completed ? " · تم إكمال الاستبيان" : " · يتبقّى إكمال الاستبيان") : ""}</span>
      `;
    }
    html += `
      <div class="cert-item">
        <div>
          <h4>${esc(t.name_ar)}</h4>
          ${issued ? `<span class="meta eligible-yes">صادرة بتاريخ ${fmtDate(issued.issued_at)} · رمز التحقق: ${esc(issued.verification_code)}</span>` : eligibilityHtml}

  body.innerHTML = html;

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div style="flex:1">
          <div id="team-name-display" style="display:flex;align-items:center;gap:8px">
            <h2 style="margin-bottom:2px">${esc(team.team_name)}</h2>
            ${membership.is_leader ? `<button class="btn-link" style="font-size:12px" onclick="toggleTeamNameEdit(true)">تعديل</button>` : ""}
          </div>
          <div id="team-name-edit" style="display:none;gap:8px;align-items:center;margin-bottom:8px">
            <input id="team-name-input" value="${esc(team.team_name)}" style="max-width:220px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px">
            <button class="btn-link" style="font-size:12px;color:var(--teal)" onclick="saveTeamName('${team.id}')">حفظ</button>
            <button class="btn-link" style="font-size:12px;color:var(--muted)" onclick="toggleTeamNameEdit(false)">إلغاء</button>
          </div>
          <p class="sub" style="margin:0">${esc(team.tracks?.name_ar || "")}</p>
        </div>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>
      <div id="team-name-alert" class="alert"></div>

      ${membership.is_leader ? `
      <div class="invite-box">
        <div class="hint">شارك هذا الرمز مع زملائك للانضمام للفريق</div>
        <div class="invite-code">${esc(team.invite_code)}</div>
      </div>` : ""}

      <h4 style="margin:18px 0 8px;font-size:13.5px;color:var(--muted)">أعضاء الفريق (${members?.length||0})</h4>
      ${(members||[]).map(m => `
        <div class="member-row">
          <span>${esc(m.profiles?.full_name||"—")} ${m.is_leader ? '<span class="leader-tag">قائد الفريق</span>' : ""}</span>
          <span class="hint">${esc(m.profiles?.organization||"")}</span>
        </div>
      `).join("")}

      ${!membership.is_leader ? `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-link" style="color:var(--danger);font-size:12.5px" onclick="leaveTeam('${membership.id}')">مغادرة الفريق</button>
        </div>
      ` : `<p class="hint" style="margin-top:14px">قائد الفريق لا يقدر يغادر مباشرة — تواصل مع الإدارة لنقل القيادة أو حذف الفريق</p>`}
    </div>

    <div class="card">
      <h2>الفكرة المقدَّمة</h2>
      <p class="sub">${submission ? "آخر تحديث: إصدار " + submission.version : "لم تُقدَّم فكرة بعد"}</p>
      ${membership.is_leader ? `
        <div class="field"><label>عنوان الفكرة</label><input id="sub-title" value="${esc(submission?.title||"")}"></div>
        <div class="field"><label>وصف الفكرة</label><textarea id="sub-desc" rows="4">${esc(submission?.description||"")}</textarea></div>
        <div class="field"><label>رابط ملف/عرض تقديمي (اختياري)</label><input id="sub-file" value="${esc(submission?.file_url||"")}"></div>
        <div id="sub-alert" class="alert"></div>
        <button class="btn btn-primary" onclick="saveSubmission('${team.id}', ${submission?.version||0})">${submission ? "تحديث الفكرة" : "إرسال الفكرة"}</button>
        <p class="hint" style="margin-top:10px">تعديل الفكرة متاح لقائد الفريق فقط</p>
      ` : submission ? `
        <p style="font-size:14px"><strong>${esc(submission.title)}</strong></p>
        <p style="font-size:13.5px;color:var(--ink)">${esc(submission.description||"")}</p>
        ${submission.file_url ? `<a href="${esc(submission.file_url)}" target="_blank" style="color:var(--teal);font-size:13px;font-weight:600">📎 فتح الملف المرفق</a>` : ""}
        <p class="hint" style="margin-top:10px">تعديل الفكرة متاح لقائد الفريق فقط</p>
      ` : `<p class="hint">قائد الفريق لم يقدّم الفكرة بعد</p>`}
    </div>
  `;
}
function toggleTeamNameEdit(show){
  document.getElementById("team-name-display").style.display = show ? "none" : "flex";
  document.getElementById("team-name-edit").style.display = show ? "flex" : "none";
  document.getElementById("team-name-alert").className = "alert";
}
async function leaveTeam(membershipId){
  if(!confirm("متأكد تبي تغادر الفريق؟ ما تقدر ترجع إلا برمز دعوة جديد.")) return;
  const { error } = await sb.from("team_members").delete().eq("id", membershipId);
  if(error){ alert("تعذّرت المغادرة: " + error.message); return; }
  renderDashboard();
}
async function saveTeamName(teamId){
  const alertBox = document.getElementById("team-name-alert");
  const newName = document.getElementById("team-name-input").value.trim();
  if(!newName){ alertBox.textContent = "اسم الفريق مطلوب"; alertBox.className = "alert error"; return; }

  const { error } = await sb.from("teams").update({ team_name: newName }).eq("id", teamId);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }
  renderDashboard();
}
async function saveSubmission(teamId, currentVersion){
  const alertBox = document.getElementById("sub-alert");
  alertBox.className = "alert";
  const title = document.getElementById("sub-title").value.trim();
  const description = document.getElementById("sub-desc").value.trim();
  const file_url = document.getElementById("sub-file").value.trim();
  if(!title){ alertBox.textContent = "عنوان الفكرة مطلوب"; alertBox.className = "alert error"; return; }

  const { error } = await sb.from("submissions").insert({
    team_id: teamId, title, description, file_url, version: currentVersion + 1
  });
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }
  alertBox.textContent = "تم الحفظ بنجاح"; alertBox.className = "alert success";
  setTimeout(()=> renderDashboard(), 900);
}
</script>
</body>
</html>
